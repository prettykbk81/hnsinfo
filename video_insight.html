<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방송 영상 분석 · 홈앤쇼핑 AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#eaeaea;color:#333;font-size:13px;}
.page-header{background:#fff;padding:13px 20px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:2px solid #ddd;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.page-title{font-size:16px;font-weight:700;color:#111;display:flex;align-items:center;gap:8px;}
.page-title .badge{background:#8b5cf6;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.5px;}
.home-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);text-decoration:none;color:#444;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:6px;}
.home-btn:hover{background:#f0f0f0;color:#8b5cf6;}
.wrap{max-width:1360px;margin:24px auto;padding:0 16px;}
.vod-inner{max-width:820px;margin:0 auto;}

/* 5단계 진행 표시 */
.steps{display:flex;background:#fff;border-radius:10px;padding:16px 12px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.step{flex:1;text-align:center;position:relative;}
.step:not(:last-child)::after{content:'';position:absolute;top:13px;left:56%;width:88%;height:2px;background:#e5e5e5;}
.step.done:not(:last-child)::after{background:#8b5cf6;}
.step-dot{width:26px;height:26px;border-radius:50%;background:#eee;color:#999;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;position:relative;z-index:1;}
.step.active .step-dot{background:#8b5cf6;color:#fff;}
.step.done .step-dot{background:#8b5cf6;color:#fff;}
.step-label{font-size:11px;color:#999;line-height:1.4;}
.step.active .step-label,.step.done .step-label{color:#333;font-weight:700;}

.section{background:#fff;border-radius:10px;padding:24px 28px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.section h2{font-size:14px;font-weight:700;color:#8b5cf6;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.search-bar{display:flex;gap:8px;}
.search-bar input{flex:1;padding:10px 14px;border:2px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;}
.search-bar input:focus{outline:none;border-color:#8b5cf6;}
.search-bar button{background:#8b5cf6;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;}
.search-bar button:hover{background:#7c3aed;} .search-bar button:disabled{background:#999;cursor:not-allowed;}
.hint{font-size:11px;color:#999;margin-top:8px;line-height:1.6;}

.loading{text-align:center;padding:36px;color:#888;}
.spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:#8b5cf6;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.error{color:#c0392b;font-weight:600;padding:16px;text-align:center;white-space:pre-wrap;line-height:1.6;}

/* 소스 확보 결과 카드 */
.video-card{display:flex;gap:14px;align-items:flex-start;}
.video-icon{width:52px;height:52px;border-radius:10px;background:#f5f3ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.video-info{flex:1;min-width:0;}
.video-title{font-size:15px;font-weight:700;color:#111;margin-bottom:6px;line-height:1.4;word-break:break-all;}
.video-meta{font-size:12px;color:#777;margin-bottom:10px;}
.video-meta span+span::before{content:'·';margin:0 6px;color:#ccc;}
.status-ok{display:inline-flex;align-items:center;gap:6px;background:#f0fdf4;color:#16a34a;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;}
.status-ok::before{content:'🎧';}
.next-hint{margin-top:14px;font-size:12px;color:#999;padding-top:14px;border-top:1px dashed #e5e5e5;}
</style>
</head>
<body>
<div class="page-header">
  <span class="page-title">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="14" rx="2" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.5"/><path d="M10 8.5v7l6-3.5z" fill="#8b5cf6"/><path d="M2 20h20" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/></svg>
    방송 영상 분석 <span class="badge">AI</span>
  </span>
  <a class="home-btn" href="https://prettykbk81.github.io/hnsinfo/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/>
    </svg>
  </a>
</div>

<div class="wrap">
  <div class="vod-inner">
    <!-- 5단계 진행 표시 -->
    <div class="steps">
      <div class="step done" id="step1"><div class="step-dot">1</div><div class="step-label">영상 링크<br/>입력</div></div>
      <div class="step active" id="step2"><div class="step-dot">2</div><div class="step-label">영상/음성<br/>소스 확보</div></div>
      <div class="step" id="step3"><div class="step-dot">3</div><div class="step-label">발화 스크립트<br/>추출(STT)</div></div>
      <div class="step" id="step4"><div class="step-dot">4</div><div class="step-label">단어 빈도<br/>분석</div></div>
      <div class="step" id="step5"><div class="step-dot">5</div><div class="step-label">AI 요약<br/>인사이트</div></div>
    </div>

    <!-- URL 입력 -->
    <div class="section">
      <h2>🔗 방송 영상 URL 입력</h2>
      <div class="search-bar">
        <input type="text" id="videoUrl" placeholder="녹화 영상 파일 링크를 입력하세요 (예: https://.../video.mp4)" onkeydown="if(event.key==='Enter')fetchSource();">
        <button id="btnFetch" onclick="fetchSource()">소스 확보</button>
      </div>
      <div class="hint">
        ※ 입력한 URL의 영상 파일을 서버(video_cache 폴더)로 내려받아, 쇼호스트 발화 분석에 사용할 소스를 확보합니다.<br/>
        ※ 로컬 PC에서 proxy.py(포트 8502)가 실행 중이어야 동작합니다.
      </div>
    </div>

    <!-- 결과 -->
    <div id="resultArea"></div>
  </div>
</div>

<script>
var PROXY = 'http://localhost:8502';

function fmtSize(bytes) {
  bytes = bytes || 0;
  if (bytes > 1024*1024*1024) return (bytes/1024/1024/1024).toFixed(2) + 'GB';
  return (bytes/1024/1024).toFixed(1) + 'MB';
}

async function fetchSource() {
  var url = document.getElementById('videoUrl').value.trim();
  var area = document.getElementById('resultArea');
  var btn = document.getElementById('btnFetch');
  if (!url) { alert('영상 URL을 입력해주세요.'); return; }

  btn.disabled = true; btn.textContent = '확보 중...';
  area.innerHTML = '<div class="section"><div class="loading"><div class="spinner"></div>영상 파일을 서버로 내려받는 중입니다...<br/>파일 크기에 따라 다소 시간이 걸릴 수 있어요.</div></div>';

  try {
    var res = await fetch(PROXY + '/api/video-info', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url: url}),
    });
    if (!res.ok) throw new Error('proxy 서버 응답 오류');
    var data = await res.json();

    if (data.error) {
      area.innerHTML = '<div class="section"><div class="error">' + esc(data.error) + '</div></div>';
      return;
    }

    window._videoInfo = data;
    renderResult(data);
  } catch (e) {
    area.innerHTML = '<div class="section"><div class="error">' +
      (e.message.indexOf('fetch') > -1 ? 'proxy.py가 실행되지 않았습니다. 로컬에서 proxy.py를 먼저 실행해주세요.' : esc(e.message)) +
      '</div></div>';
  } finally {
    btn.disabled = false; btn.textContent = '소스 확보';
  }
}

function renderResult(d) {
  var area = document.getElementById('resultArea');
  var html = '<div class="section">';
  html += '<h2>✅ 소스 확보 완료</h2>';
  html += '<div class="video-card">';
  html += '<div class="video-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="14" rx="2" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.5"/><path d="M10 8.5v7l6-3.5z" fill="#8b5cf6"/></svg></div>';
  html += '<div class="video-info">';
  html += '<div class="video-title">' + esc(d.title || '(파일명 없음)') + '</div>';
  html += '<div class="video-meta"><span>' + esc(d.content_type || '알 수 없는 형식') + '</span><span>' + fmtSize(d.size) + '</span></div>';
  html += '<span class="status-ok">영상 소스 확보 완료</span>';
  html += '<div class="next-hint">다음 단계인 발화 스크립트 추출(STT)은 준비 중입니다.</div>';
  html += '</div></div></div>';
  area.innerHTML = html;
  document.getElementById('step2').classList.add('done');
  area.scrollIntoView({behavior:'smooth'});
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
