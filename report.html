<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 보고서 자동 생성기 · 홈앤쇼핑 AI</title>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#eaeaea;color:#333;font-size:13px;}
.page-header{background:#fff;padding:13px 20px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:2px solid #ddd;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.page-title{font-size:16px;font-weight:700;color:#111;}
.home-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);text-decoration:none;color:#444;display:flex;align-items:center;width:34px;height:34px;border-radius:6px;transition:background .15s;justify-content:center;}
.home-btn:hover{background:#f0f0f0;color:#e8192c;}
.wrap{max-width:860px;margin:24px auto;padding:0 16px;}
.section{background:#fff;border-radius:10px;padding:24px 28px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.section h2{font-size:14px;font-weight:700;color:#0369a1;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;}
label{display:block;font-weight:600;margin-bottom:6px;color:#555;}
select,input[type=text]{width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;background:#fff;}
select:focus,input:focus,textarea:focus{outline:none;border-color:#0369a1;}
textarea{width:100%;height:160px;padding:12px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;resize:vertical;line-height:1.6;}
.hint{font-size:11px;color:#999;margin-top:4px;}
.btn-area{text-align:center;margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn-run{background:#0369a1;color:#fff;border:none;padding:12px 36px;border-radius:6px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s;}
.btn-run:hover{background:#024e7c;}
.btn-run:disabled{background:#999;cursor:not-allowed;}
.btn-copy{background:#333;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;display:none;}
.btn-copy:hover{background:#111;}
.btn-word{background:#2b579a;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;display:none;transition:background .15s;}
.btn-word:hover{background:#1e3f6f;}
.btn-ppt{background:#d24726;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;display:none;transition:background .15s;}
.btn-ppt:hover{background:#a83820;}
.result{display:none;}
.result h2{color:#0369a1;}
.result-body{white-space:pre-wrap;line-height:1.8;font-size:13px;color:#333;border:1px solid #e0e0e0;border-radius:8px;padding:20px;background:#fafafa;}
.ai-loading{text-align:center;padding:30px;color:#888;}
.ai-spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:#0369a1;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.ai-cursor{display:inline-block;width:2px;height:14px;background:#0369a1;animation:blink .6s infinite;}
@keyframes blink{50%{opacity:0;}}
.error{color:#c0392b;font-weight:600;padding:16px;text-align:center;}
</style>
</head>
<body>
<div class="page-header">
  <span class="page-title">업무 보고서 자동 생성기</span>
  <a class="home-btn" href="https://prettykbk81.github.io/hnsinfo/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/>
    </svg>
  </a>
</div>

<div class="wrap">
  <div class="section">
    <h2>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/><polyline points="14,2 14,8 20,8" stroke="#0369a1" stroke-width="2"/></svg>
      보고서 설정
    </h2>
    <div class="form-row">
      <div>
        <label for="rType">보고서 유형</label>
        <select id="rType">
          <option value="주간업무보고">주간업무보고</option>
          <option value="월간실적보고">월간실적보고</option>
          <option value="기획보고">기획보고</option>
          <option value="회의록 정리">회의록 정리</option>
          <option value="업무 인수인계서">업무 인수인계서</option>
        </select>
      </div>
      <div>
        <label for="rTarget">보고 대상</label>
        <select id="rTarget">
          <option value="팀장">팀장</option>
          <option value="실장/부서장">실장/부서장</option>
          <option value="임원">임원</option>
          <option value="경영진">경영진</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div>
        <label for="rPeriod">보고 기간</label>
        <input type="text" id="rPeriod" placeholder="예) 2026.06.09 ~ 06.13">
      </div>
      <div>
        <label for="rDept">부서/팀</label>
        <input type="text" id="rDept" placeholder="예) 영업기획팀">
      </div>
    </div>
    <label for="rContent">핵심 내용 (키워드 또는 메모)</label>
    <textarea id="rContent" placeholder="보고서에 들어갈 내용을 간단히 적어주세요.&#10;&#10;예)&#10;- 6월 2주차 매출 전주대비 12% 상승&#10;- 식품 카테고리 신규 입점사 3개 확보&#10;- 라이브커머스 시범 방송 2회 진행, 평균 시청 3,200명&#10;- 다음 주 목표: 여름 시즌 기획전 준비"></textarea>
    <div class="hint">※ 키워드만 나열해도 AI가 문장으로 완성합니다</div>
    <div class="btn-area">
      <button class="btn-run" id="btnRun" onclick="generate()">보고서 생성</button>
    </div>
  </div>

  <div class="section result" id="resultSection">
    <h2>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="#0369a1" stroke-width="2"/><path d="M7 8h10M7 12h10M7 16h6" stroke="#0369a1" stroke-width="1.5" stroke-linecap="round"/></svg>
      생성된 보고서
    </h2>
    <div class="result-body" id="resultBody"></div>
    <div class="btn-area" id="exportBtns" style="margin-top:16px;">
      <button class="btn-copy" id="btnCopy" onclick="copyResult()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px;margin-right:4px;"><rect x="9" y="9" width="13" height="13" rx="2" stroke="#fff" stroke-width="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="#fff" stroke-width="2"/></svg>
        복사하기
      </button>
      <button class="btn-word" id="btnWord" onclick="exportWord()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px;margin-right:4px;"><path d="M4 4h16v16H4z" stroke="#fff" stroke-width="2" rx="2"/><path d="M7 8l2.5 8L12 10l2.5 6L17 8" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Word 저장
      </button>
      <button class="btn-ppt" id="btnPpt" onclick="exportPPT()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px;margin-right:4px;"><rect x="2" y="3" width="20" height="14" rx="2" stroke="#fff" stroke-width="2"/><path d="M8 17v3M16 17v3M5 20h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M9 7h3a2 2 0 0 1 0 4H9V7z" stroke="#fff" stroke-width="1.5"/></svg>
        PPT 저장
      </button>
    </div>
  </div>
</div>

<script>
var _reportMeta = {};

async function generate() {
  var type = document.getElementById('rType').value;
  var target = document.getElementById('rTarget').value;
  var period = document.getElementById('rPeriod').value.trim();
  var dept = document.getElementById('rDept').value.trim();
  var content = document.getElementById('rContent').value.trim();
  if (!content) { alert('핵심 내용을 입력해주세요.'); return; }

  _reportMeta = {type:type, target:target, period:period, dept:dept||'영업기획팀'};

  var section = document.getElementById('resultSection');
  var body = document.getElementById('resultBody');
  var btn = document.getElementById('btnRun');
  section.style.display = 'block';
  hideExportBtns();
  body.innerHTML = '<div class="ai-loading"><div class="ai-spinner"></div>Claude가 보고서를 작성 중입니다...</div>';
  btn.disabled = true; btn.textContent = '생성 중...';

  var prompt = '당신은 홈앤쇼핑 ' + (dept || '영업기획팀') + ' 소속 직원입니다.\n\n';
  prompt += '다음 정보로 ' + type + '를 작성해주세요:\n\n';
  prompt += '보고서 유형: ' + type + '\n';
  prompt += '보고 대상: ' + target + '\n';
  if (period) prompt += '보고 기간: ' + period + '\n';
  if (dept) prompt += '부서: ' + dept + '\n';
  prompt += '\n핵심 내용:\n' + content + '\n\n';
  prompt += '작성 규칙:\n';
  prompt += '- ' + target + '에게 보고하는 공식 문서 톤으로 작성\n';
  prompt += '- 한국 대기업/홈쇼핑 회사 보고서 형식에 맞게\n';
  prompt += '- 수치가 있으면 강조하고, 전주/전월 대비 변화율 포함\n';
  prompt += '- 마지막에 "향후 계획" 또는 "요청사항" 섹션 포함\n';
  prompt += '- 불필요한 인사말 없이 바로 본론으로\n';
  prompt += '- 읽기 쉽게 구조화 (제목, 소제목, 번호 활용)';

  try {
    var resp = await fetch('http://localhost:8502/api/summarize', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt: prompt}),
    });
    if (!resp.ok) throw new Error('프록시 서버 연결 실패');

    body.innerHTML = '';
    var textNode = document.createTextNode('');
    var cursor = document.createElement('span');
    cursor.className = 'ai-cursor';
    body.appendChild(textNode);
    body.appendChild(cursor);

    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';
    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, {stream: true});
      var lines = buffer.split('\n');
      buffer = lines.pop();
      for (var line of lines) {
        if (!line.startsWith('data: ')) continue;
        var payload = line.slice(6);
        if (payload === '[DONE]') { cursor.remove(); break; }
        try { textNode.textContent += JSON.parse(payload).text; } catch(e) {}
      }
    }
    cursor.remove();
    showExportBtns();
  } catch(e) {
    body.innerHTML = '<div class="error">' +
      (e.message.indexOf('fetch') > -1 ? 'app.py(Streamlit)가 실행되지 않았습니다.<br>streamlit run app.py 를 먼저 실행해주세요.' : e.message) +
      '</div>';
  } finally {
    btn.disabled = false; btn.textContent = '보고서 생성';
  }
}

function hideExportBtns() {
  ['btnCopy','btnWord','btnPpt'].forEach(function(id){document.getElementById(id).style.display='none';});
}
function showExportBtns() {
  ['btnCopy','btnWord','btnPpt'].forEach(function(id){document.getElementById(id).style.display='inline-flex';});
}

function copyResult() {
  navigator.clipboard.writeText(document.getElementById('resultBody').textContent).then(function() {
    var btn = document.getElementById('btnCopy');
    btn.innerHTML = '복사 완료!';
    setTimeout(function() { btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px;margin-right:4px;"><rect x="9" y="9" width="13" height="13" rx="2" stroke="#fff" stroke-width="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="#fff" stroke-width="2"/></svg>복사하기'; }, 1500);
  });
}

/* ── 텍스트 → 구조 파싱 ── */
function parseReport(text) {
  var lines = text.split('\n');
  var sections = [];
  var current = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var trimmed = line.trim();
    if (!trimmed) continue;
    // 대제목: # 또는 ===, 또는 [ ] 로 감싼 제목
    if (/^#{1,2}\s/.test(trimmed) || /^\[.+\]/.test(trimmed) && trimmed.length < 60) {
      current = {title: trimmed.replace(/^#{1,2}\s*/, '').replace(/[\[\]]/g,'').trim(), items: []};
      sections.push(current);
    }
    // 소제목: ### 또는 숫자. 로 시작
    else if (/^#{3}\s/.test(trimmed) || /^\d+\.\s/.test(trimmed) && trimmed.length < 80 && !trimmed.match(/^\d+\.\s.{40,}/)) {
      if (!current) { current = {title: '', items: []}; sections.push(current); }
      current.items.push({type:'subtitle', text: trimmed.replace(/^#{3}\s*/, '').replace(/^\d+\.\s*/, '').trim()});
    }
    // 글머리: - 또는 •
    else if (/^[-•·]\s/.test(trimmed)) {
      if (!current) { current = {title: '', items: []}; sections.push(current); }
      current.items.push({type:'bullet', text: trimmed.replace(/^[-•·]\s*/, '').trim()});
    }
    // 일반 텍스트
    else {
      if (!current) { current = {title: '', items: []}; sections.push(current); }
      current.items.push({type:'text', text: trimmed});
    }
  }
  return sections;
}

/* ── Word (.doc) 저장 ── */
function exportWord() {
  var text = document.getElementById('resultBody').textContent;
  var m = _reportMeta;
  var title = (m.dept||'') + ' ' + (m.type||'보고서');
  var sections = parseReport(text);

  var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">';
  html += '<head><meta charset="utf-8">';
  html += '<style>';
  html += 'body{font-family:"맑은 고딕",sans-serif;font-size:11pt;line-height:1.8;color:#333;margin:40px 50px;}';
  html += 'h1{font-size:18pt;color:#1a1a1a;border-bottom:3px solid #e8192c;padding-bottom:8px;margin:0 0 20px;}';
  html += 'h2{font-size:13pt;color:#0369a1;margin:18px 0 8px;border-left:4px solid #0369a1;padding-left:10px;}';
  html += 'h3{font-size:11pt;color:#333;margin:12px 0 6px;font-weight:700;}';
  html += 'p{margin:4px 0;text-align:justify;}';
  html += 'ul{margin:4px 0 4px 20px;}';
  html += 'li{margin:3px 0;}';
  html += '.meta{font-size:10pt;color:#888;margin-bottom:16px;}';
  html += '.footer{margin-top:30px;padding-top:12px;border-top:1px solid #ddd;font-size:9pt;color:#aaa;text-align:center;}';
  html += '</style></head><body>';

  html += '<h1>' + escHtml(title) + '</h1>';
  html += '<div class="meta">';
  if (m.period) html += '보고 기간: ' + escHtml(m.period) + '<br>';
  html += '보고 대상: ' + escHtml(m.target||'') + ' | 부서: ' + escHtml(m.dept||'') + '</div>';

  for (var s = 0; s < sections.length; s++) {
    var sec = sections[s];
    if (sec.title) html += '<h2>' + escHtml(sec.title) + '</h2>';
    for (var j = 0; j < sec.items.length; j++) {
      var it = sec.items[j];
      if (it.type === 'subtitle') html += '<h3>' + escHtml(it.text) + '</h3>';
      else if (it.type === 'bullet') html += '<ul><li>' + escHtml(it.text) + '</li></ul>';
      else html += '<p>' + escHtml(it.text) + '</p>';
    }
  }

  html += '<div class="footer">홈앤쇼핑 AI 보고서 자동 생성기 · powered by Claude</div>';
  html += '</body></html>';

  var blob = new Blob(['﻿' + html], {type: 'application/msword;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = title.replace(/\s+/g,'_') + '_' + today() + '.doc';
  a.click();
  URL.revokeObjectURL(url);
}

/* ── PPT (.pptx) 저장 ── */
function exportPPT() {
  var text = document.getElementById('resultBody').textContent;
  var m = _reportMeta;
  var title = (m.dept||'') + ' ' + (m.type||'보고서');
  var sections = parseReport(text);

  var pptx = new PptxGenJS();
  pptx.layout = 'LAYOUT_WIDE';
  pptx.author = '홈앤쇼핑 AI';

  // 표지 슬라이드
  var cover = pptx.addSlide();
  cover.background = {fill: 'E8192C'};
  cover.addText(title, {x:0.8, y:1.5, w:'90%', h:1.2, fontSize:36, fontFace:'맑은 고딕', color:'FFFFFF', bold:true});
  var subText = (m.period ? m.period + '\n' : '') + (m.dept||'') + ' | 보고 대상: ' + (m.target||'');
  cover.addText(subText, {x:0.8, y:3.0, w:'90%', h:0.8, fontSize:16, fontFace:'맑은 고딕', color:'FFD0D5'});
  cover.addText('홈앤쇼핑 AI 보고서 자동 생성기', {x:0.8, y:5.0, w:'90%', h:0.4, fontSize:11, fontFace:'맑은 고딕', color:'FFFFFF', italic:true, transparency:40});

  // 내용 슬라이드
  for (var s = 0; s < sections.length; s++) {
    var sec = sections[s];
    if (!sec.title && sec.items.length === 0) continue;

    var slide = pptx.addSlide();
    // 상단 빨간 바
    slide.addShape(pptx.ShapeType.rect, {x:0, y:0, w:'100%', h:0.08, fill:{color:'E8192C'}});
    // 제목
    var slideTitle = sec.title || '상세 내용';
    slide.addText(slideTitle, {x:0.6, y:0.3, w:'90%', h:0.6, fontSize:24, fontFace:'맑은 고딕', color:'1A1A1A', bold:true});
    // 구분선
    slide.addShape(pptx.ShapeType.rect, {x:0.6, y:0.9, w:1.5, h:0.04, fill:{color:'E8192C'}});

    // 내용
    var bodyRows = [];
    for (var j = 0; j < sec.items.length; j++) {
      var it = sec.items[j];
      if (it.type === 'subtitle') {
        bodyRows.push({text: it.text, options: {fontSize:15, fontFace:'맑은 고딕', color:'0369A1', bold:true, bullet:false, spaceBefore:12}});
      } else if (it.type === 'bullet') {
        bodyRows.push({text: it.text, options: {fontSize:13, fontFace:'맑은 고딕', color:'333333', bullet:{type:'bullet', style:'arabicPeriod'}, indentLevel:0, spaceBefore:4}});
      } else {
        bodyRows.push({text: it.text, options: {fontSize:13, fontFace:'맑은 고딕', color:'444444', bullet:false, spaceBefore:4}});
      }
    }
    if (bodyRows.length) {
      slide.addText(bodyRows, {x:0.6, y:1.15, w:'85%', h:4.2, valign:'top', lineSpacing:22});
    }
    // 페이지 번호
    slide.addText((s+2)+'', {x:'93%', y:'93%', w:0.5, h:0.3, fontSize:10, color:'AAAAAA', align:'right'});
  }

  pptx.writeFile({fileName: title.replace(/\s+/g,'_') + '_' + today() + '.pptx'});
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function today() { var d=new Date(); return d.getFullYear()+''+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1)+(d.getDate()<10?'0':'')+d.getDate(); }
</script>
</body>
</html>
