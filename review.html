<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 리뷰 분석기 · 홈앤쇼핑 AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#eaeaea;color:#333;font-size:13px;}
.page-header{background:#fff;padding:13px 20px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:2px solid #ddd;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.page-title{font-size:16px;font-weight:700;color:#111;}
.home-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);text-decoration:none;color:#444;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:6px;}
.home-btn:hover{background:#f0f0f0;color:#e8192c;}
.wrap{max-width:960px;margin:24px auto;padding:0 16px;}
.section{background:#fff;border-radius:10px;padding:24px 28px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.section h2{font-size:14px;font-weight:700;color:#e8192c;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.search-bar{display:flex;gap:8px;}
.search-bar input{flex:1;padding:10px 14px;border:2px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;}
.search-bar input:focus{outline:none;border-color:#e8192c;}
.search-bar button{background:#e8192c;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;}
.search-bar button:hover{background:#c8001f;} .search-bar button:disabled{background:#999;cursor:not-allowed;}
.hint{font-size:11px;color:#999;margin-top:6px;}
.ai-loading{text-align:center;padding:30px;color:#888;}
.ai-spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:#e8192c;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.error{color:#c0392b;font-weight:600;padding:16px;text-align:center;}
.step-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:#e8192c;color:#fff;border-radius:50%;font-size:11px;font-weight:700;}

/* 상품 리스트 */
.product-list{margin-top:16px;}
.product-row{display:flex;gap:14px;padding:14px;border:1.5px solid #eee;border-radius:10px;margin-bottom:10px;align-items:center;background:#fff;transition:border-color .15s;}
.product-row:hover{border-color:#e8192c;}
.pr-img{width:80px;height:80px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#f5f5f5;}
.pr-info{flex:1;min-width:0;}
.pr-name{font-size:13px;font-weight:700;color:#111;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pr-price{font-size:14px;font-weight:800;color:#e8192c;margin-bottom:4px;}
.pr-score-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pr-score{font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;}
.pr-score.high{background:#f0fdf4;color:#16a34a;}
.pr-score.mid{background:#fffbeb;color:#d97706;}
.pr-score.low{background:#fef2f2;color:#dc2626;}
.pr-score.none{background:#f5f5f5;color:#999;}
.pr-count{font-size:11px;color:#888;}
.pr-dist{display:flex;gap:1px;height:6px;border-radius:3px;overflow:hidden;width:120px;}
.pr-loading{font-size:11px;color:#aaa;font-style:italic;}

/* 종합 분석 결과 */
.summary-header{background:linear-gradient(135deg,#e8192c,#c8001f);color:#fff;padding:24px 28px;border-radius:10px;margin-bottom:14px;}
.summary-header h1{font-size:20px;font-weight:800;margin-bottom:4px;}
.summary-header p{font-size:12px;opacity:.75;}
.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.analysis-card{background:#fff;border-radius:10px;padding:18px 20px;box-shadow:0 1px 6px rgba(0,0,0,.06);border-top:3px solid #ddd;}
.analysis-card.good{border-top-color:#16a34a;} .analysis-card.bad{border-top-color:#dc2626;}
.analysis-card.delivery{border-top-color:#2563eb;} .analysis-card.value{border-top-color:#d97706;}
.ac-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.ac-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.ac-icon.good{background:#f0fdf4;} .ac-icon.bad{background:#fef2f2;}
.ac-icon.delivery{background:#eff6ff;} .ac-icon.value{background:#fffbeb;}
.ac-title{font-size:13px;font-weight:700;color:#333;}
.ac-list{list-style:none;padding:0;margin:0;}
.ac-list li{padding:5px 0 5px 12px;border-left:3px solid #eee;margin-bottom:3px;font-size:12px;line-height:1.6;color:#555;}
.analysis-card.good .ac-list li{border-left-color:#bbf7d0;}
.analysis-card.bad .ac-list li{border-left-color:#fecaca;}
.analysis-card.delivery .ac-list li{border-left-color:#bfdbfe;}
.analysis-card.value .ac-list li{border-left-color:#fef08a;}
.tip-section{background:#fff;border-radius:10px;padding:18px 22px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:14px;}
.tip-section h3{font-size:13px;font-weight:700;color:#7c3aed;margin-bottom:10px;}
.tip-item{padding:8px 12px;margin-bottom:5px;background:#f5f3ff;border-radius:6px;border-left:4px solid #7c3aed;font-size:12px;color:#444;}
.result-fallback{white-space:pre-wrap;line-height:1.7;font-size:13px;color:#333;padding:16px;background:#fafafa;border-radius:8px;border:1px solid #e0e0e0;}
@media(max-width:600px){.analysis-grid{grid-template-columns:1fr;}.product-row{flex-wrap:wrap;}}
</style>
</head>
<body>
<div class="page-header">
  <span class="page-title">상품 리뷰 분석기</span>
  <a class="home-btn" href="https://prettykbk81.github.io/hnsinfo/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/>
    </svg>
  </a>
</div>

<div class="wrap">
  <div class="section">
    <h2><span class="step-badge">1</span> 상품 검색</h2>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="검색어를 입력하세요 (예: 홍삼, 선풍기, 한라봉)" onkeypress="if(event.keyCode===13)searchAll()">
      <button id="btnSearch" onclick="searchAll()">검색 &amp; 분석</button>
    </div>
    <div class="hint">※ 홈앤쇼핑 상품 검색 → 각 상품 만족도 수집 → 블로그 후기 분석까지 한번에 진행됩니다</div>
  </div>

  <div id="resultArea"></div>
</div>

<script>
var PROXY = 'http://localhost:8502';
var DIST_COLORS = {'매우만족':'#16a34a','만족':'#22c55e','보통':'#eab308','불만족':'#f97316','매우불만족':'#dc2626'};

async function searchAll() {
  var q = document.getElementById('searchInput').value.trim();
  if (!q) { alert('검색어를 입력해주세요.'); return; }
  var area = document.getElementById('resultArea');
  var btn = document.getElementById('btnSearch');
  btn.disabled = true; btn.textContent = '검색 중...';
  area.innerHTML = '<div class="section"><div class="ai-loading"><div class="ai-spinner"></div>홈앤쇼핑에서 상품을 검색하고 있습니다...</div></div>';

  try {
    // 1. 상품 검색
    var r = await fetch(PROXY + '/api/search-product?q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('프록시 연결 실패');
    var products = await r.json();
    if (!products.length) { area.innerHTML = '<div class="section" style="text-align:center;color:#888;padding:40px;">검색 결과가 없습니다.</div>'; return; }

    // 2. 상품 리스트 렌더 (로딩 상태)
    area.innerHTML = '<div class="section"><h2><span class="step-badge">2</span> 검색된 상품 (' + products.length + '개) — 만족도 수집 중...</h2><div class="product-list" id="productList"></div></div><div id="analysisArea"></div>';
    var list = document.getElementById('productList');
    products.forEach(function(p, i) {
      list.innerHTML += '<div class="product-row" id="pr-' + i + '">'
        + '<img class="pr-img" src="' + p.image + '" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect fill=%22%23f5f5f5%22 width=%2280%22 height=%2280%22/><text x=%2240%22 y=%2244%22 text-anchor=%22middle%22 fill=%22%23ccc%22 font-size=%2212%22>No Image</text></svg>\'">'
        + '<div class="pr-info">'
        + '<div class="pr-name">' + esc(p.name) + '</div>'
        + (p.price ? '<div class="pr-price">' + p.price + '원</div>' : '')
        + '<div class="pr-score-wrap" id="score-' + i + '"><span class="pr-loading">만족도 로딩 중...</span></div>'
        + '</div></div>';
    });

    // 3. 각 상품 만족도 병렬 수집
    var scorePromises = products.map(function(p) {
      return fetch(PROXY + '/api/product-score?code=' + p.code).then(function(r){return r.json();}).catch(function(){return {};});
    });
    var scores = await Promise.all(scorePromises);

    scores.forEach(function(sc, i) {
      var el = document.getElementById('score-' + i);
      if (!el) return;
      if (sc.score) {
        var cls = parseInt(sc.score) >= 80 ? 'high' : parseInt(sc.score) >= 60 ? 'mid' : 'low';
        var html = '<span class="pr-score ' + cls + '">' + sc.score + '점 ' + (sc.level||'') + '</span>';
        html += '<span class="pr-count">상품평 ' + sc.count + '건</span>';
        if (sc.distribution) {
          var total = 0;
          Object.values(sc.distribution).forEach(function(v){total+=v;});
          if (total > 0) {
            html += '<div class="pr-dist">';
            ['매우만족','만족','보통','불만족','매우불만족'].forEach(function(l){
              var v = sc.distribution[l]||0;
              if(v>0) html += '<div style="width:'+((v/total)*100)+'%;background:'+(DIST_COLORS[l]||'#ccc')+';"></div>';
            });
            html += '</div>';
          }
        }
        el.innerHTML = html;
      } else {
        el.innerHTML = '<span class="pr-score none">만족도 정보 없음</span>';
      }
      products[i]._score = sc;
    });

    // 4. 블로그 후기 수집 + AI 분석
    document.querySelector('#resultArea .section h2').innerHTML = '<span class="step-badge">2</span> 검색된 상품 (' + products.length + '개)';
    var analysisArea = document.getElementById('analysisArea');
    analysisArea.innerHTML = '<div class="section"><div class="ai-loading"><div class="ai-spinner"></div>블로그 후기를 수집하고 AI가 분석 중입니다...</div></div>';

    var blogR = await fetch(PROXY + '/api/search-reviews?q=' + encodeURIComponent('홈앤쇼핑 ' + q + ' 후기 리뷰') + '&n=10');
    var blogs = await blogR.json();

    // 상품별 요약 텍스트 구성
    var promptData = products.map(function(p, i) {
      var sc = p._score || {};
      return (i+1) + '. ' + p.name + ' (' + (p.price||'가격미정') + '원)'
        + (sc.score ? ' — 만족도 ' + sc.score + '점(' + sc.level + '), 상품평 ' + sc.count + '건' : '');
    }).join('\n');

    var blogText = blogs.map(function(b, i) {
      return '[블로그' + (i+1) + '] ' + b.title + '\n' + b.desc;
    }).join('\n\n');

    var prompt = '당신은 홈쇼핑 상품 리뷰 분석 전문가입니다.\n\n';
    prompt += '검색어: "' + q + '"\n\n';
    prompt += '홈앤쇼핑에서 검색된 상품 목록:\n' + promptData + '\n\n';
    prompt += '네이버 블로그 후기:\n' + blogText + '\n\n';
    prompt += '위 정보를 종합 분석하여 반드시 아래 JSON으로만 응답하세요:\n';
    prompt += '{\n';
    prompt += '  "summary": "전체 검색 결과 종합 평가 (40자 내외)",\n';
    prompt += '  "best_pick": "가장 추천하는 상품명 1개",\n';
    prompt += '  "best_reason": "추천 이유 (30자 내외)",\n';
    prompt += '  "good": ["장점1 (구체적 후기 인용 포함)", "장점2", "장점3", "장점4"],\n';
    prompt += '  "bad": ["단점/아쉬운점1", "단점2", "단점3"],\n';
    prompt += '  "delivery": ["배송/포장 관련1", "관련2"],\n';
    prompt += '  "value": ["가성비 관련1", "관련2"],\n';
    prompt += '  "tip": ["MD 개선제안1", "제안2", "제안3"]\n';
    prompt += '}';

    var aiR = await fetch(PROXY + '/api/summarize', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt:prompt}),
    });
    var fullText = '';
    var reader = aiR.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';
    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, {stream:true});
      var lines = buffer.split('\n');
      buffer = lines.pop();
      for (var line of lines) {
        if (!line.startsWith('data: ')) continue;
        var p = line.slice(6);
        if (p === '[DONE]') break;
        try { fullText += JSON.parse(p).text; } catch(e) {}
      }
    }

    var analysis = tryParse(fullText);
    if (analysis) {
      renderAnalysis(analysis, q, products.length, blogs.length);
    } else {
      analysisArea.innerHTML = '<div class="section"><div class="result-fallback">' + esc(fullText) + '</div></div>';
    }

  } catch(e) {
    area.innerHTML = '<div class="section"><div class="error">' +
      (e.message.indexOf('fetch')>-1||e.message.indexOf('Failed')>-1 ? 'streamlit run app.py 를 먼저 실행해주세요.' : esc(e.message)) + '</div></div>';
  } finally {
    btn.disabled = false; btn.textContent = '검색 & 분석';
  }
}

function tryParse(text) {
  var m = text.match(/\{[\s\S]*\}/);
  if (!m) return null;
  var raw = m[0].replace(/,\s*([\]}])/g,'$1');
  try { return JSON.parse(raw); } catch(e) {}
  raw = raw.replace(/:\s*"([^"]*)\n([^"]*)"(?=\s*[,\]}])/g, function(m,a,b){return ': "'+a+' '+b+'"';});
  try { return JSON.parse(raw); } catch(e) {}
  return null;
}

function renderAnalysis(a, query, productCount, blogCount) {
  var area = document.getElementById('analysisArea');
  var html = '';

  // 종합 헤더
  html += '<div class="summary-header">';
  html += '<h1>"' + esc(query) + '" 종합 리뷰 분석</h1>';
  html += '<p>홈앤쇼핑 상품 ' + productCount + '개 + 블로그 후기 ' + blogCount + '건 분석</p>';
  html += '<p style="margin-top:8px;font-size:13px;opacity:.9;">' + esc(a.summary||'') + '</p>';
  if (a.best_pick) {
    html += '<div style="margin-top:10px;padding:8px 14px;background:rgba(255,255,255,.15);border-radius:6px;display:inline-block;">';
    html += '<span style="font-size:11px;opacity:.7;">BEST PICK</span><br>';
    html += '<strong style="font-size:15px;">🏆 ' + esc(a.best_pick) + '</strong>';
    if (a.best_reason) html += '<span style="font-size:12px;opacity:.8;margin-left:8px;">' + esc(a.best_reason) + '</span>';
    html += '</div>';
  }
  html += '</div>';

  // 분석 카드
  html += '<div class="analysis-grid">';
  html += makeCard('good','👍','장점', a.good);
  html += makeCard('bad','👎','단점 / 아쉬운 점', a.bad);
  html += makeCard('delivery','📦','배송 / 포장', a.delivery);
  html += makeCard('value','💰','가성비', a.value);
  html += '</div>';

  // MD 제안
  if (a.tip && a.tip.length) {
    html += '<div class="tip-section"><h3>💡 MD 개선 제안</h3>';
    a.tip.forEach(function(t, i) {
      html += '<div class="tip-item"><strong style="color:#7c3aed;">' + (i+1) + '.</strong> ' + esc(t) + '</div>';
    });
    html += '</div>';
  }

  area.innerHTML = html;
  area.scrollIntoView({behavior:'smooth', block:'start'});
}

function makeCard(cls, icon, title, items) {
  var h = '<div class="analysis-card ' + cls + '">';
  h += '<div class="ac-header"><div class="ac-icon ' + cls + '">' + icon + '</div>';
  h += '<div class="ac-title">' + title + '</div></div>';
  h += '<ul class="ac-list">';
  (items||['분석 데이터 없음']).forEach(function(it){ h += '<li>' + esc(it) + '</li>'; });
  h += '</ul></div>';
  return h;
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
