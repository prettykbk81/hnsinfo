<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 리뷰 분석기 · 홈앤쇼핑 AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#eaeaea;color:#333;font-size:13px;}
.page-header{background:#fff;padding:13px 20px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:2px solid #ddd;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.page-title{font-size:16px;font-weight:700;color:#111;}
.home-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);text-decoration:none;color:#444;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:6px;transition:background .15s;}
.home-btn:hover{background:#f0f0f0;color:#e8192c;}
.wrap{max-width:900px;margin:24px auto;padding:0 16px;}
.section{background:#fff;border-radius:10px;padding:24px 28px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.section h2{font-size:14px;font-weight:700;color:#e8192c;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
/* 검색 */
.search-bar{display:flex;gap:8px;}
.search-bar input{flex:1;padding:10px 14px;border:2px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;}
.search-bar input:focus{outline:none;border-color:#e8192c;}
.search-bar button{background:#e8192c;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;}
.search-bar button:hover{background:#c8001f;}
.search-bar button:disabled{background:#999;cursor:not-allowed;}
.hint{font-size:11px;color:#999;margin-top:6px;}
/* 상품 그리드 */
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;}
.product-card{border:2px solid #eee;border-radius:10px;overflow:hidden;cursor:pointer;transition:all .15s;text-align:center;background:#fff;}
.product-card:hover{border-color:#e8192c;box-shadow:0 2px 12px rgba(232,25,44,.15);transform:translateY(-2px);}
.product-card.selected{border-color:#e8192c;background:#fff5f5;}
.product-card img{width:100%;aspect-ratio:1;object-fit:cover;background:#f5f5f5;}
.product-card .p-name{padding:8px 6px 4px;font-size:11.5px;font-weight:600;color:#333;line-height:1.4;height:48px;overflow:hidden;}
.product-card .p-price{padding:0 6px 8px;font-size:13px;font-weight:800;color:#e8192c;}
/* 선택된 상품 정보 */
.selected-product{display:none;margin-top:16px;padding:16px;background:#fafafa;border-radius:8px;border:1px solid #eee;}
.sp-row{display:flex;gap:16px;align-items:flex-start;}
.sp-img{width:120px;height:120px;border-radius:8px;object-fit:cover;background:#eee;flex-shrink:0;}
.sp-info{flex:1;}
.sp-name{font-size:15px;font-weight:700;color:#111;margin-bottom:6px;}
.sp-price{font-size:14px;color:#e8192c;font-weight:700;margin-bottom:8px;}
.sp-score{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:#fff5f5;border-radius:12px;font-size:12px;font-weight:600;color:#e8192c;}
.sp-reviews{font-size:11px;color:#888;margin-top:6px;}
/* 블로그 후기 */
.blog-list{margin-top:14px;}
.blog-item{padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:12px;line-height:1.6;}
.blog-item:last-child{border-bottom:none;}
.blog-item .b-title{font-weight:600;color:#333;}
.blog-item .b-desc{color:#666;margin-top:2px;}
.blog-item .b-meta{font-size:10px;color:#aaa;margin-top:3px;}
/* 분석 결과 */
.result{display:none;}
.ai-loading{text-align:center;padding:30px;color:#888;}
.ai-spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:#e8192c;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.error{color:#c0392b;font-weight:600;padding:16px;text-align:center;}
.btn-analyze{background:#e8192c;color:#fff;border:none;padding:11px 32px;border-radius:6px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:14px;}
.btn-analyze:hover{background:#c8001f;}
.btn-analyze:disabled{background:#999;cursor:not-allowed;}

/* 종합 평가 헤더 */
.review-header{background:linear-gradient(135deg,#e8192c,#c8001f);color:#fff;padding:24px 28px;border-radius:10px;margin-bottom:14px;display:flex;align-items:center;gap:20px;}
.rh-score{font-size:48px;font-weight:900;line-height:1;}
.rh-score small{font-size:18px;font-weight:400;opacity:.7;}
.rh-info{flex:1;}
.rh-info h3{font-size:16px;font-weight:700;margin-bottom:4px;}
.rh-info p{font-size:12px;opacity:.8;}
.rh-stars{font-size:20px;letter-spacing:2px;}

/* 분석 카드 그리드 */
.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.analysis-card{background:#fff;border-radius:10px;padding:20px 22px;box-shadow:0 1px 6px rgba(0,0,0,.06);border-top:3px solid #ddd;}
.analysis-card.good{border-top-color:#16a34a;} .analysis-card.bad{border-top-color:#dc2626;}
.analysis-card.delivery{border-top-color:#2563eb;} .analysis-card.value{border-top-color:#d97706;}
.analysis-card.tip{border-top-color:#7c3aed;} .analysis-card.diff{border-top-color:#0d9488;}
.ac-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.ac-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.ac-icon.good{background:#f0fdf4;} .ac-icon.bad{background:#fef2f2;}
.ac-icon.delivery{background:#eff6ff;} .ac-icon.value{background:#fffbeb;}
.ac-icon.tip{background:#f5f3ff;} .ac-icon.diff{background:#f0fdfa;}
.ac-title{font-size:14px;font-weight:700;color:#333;}
.ac-list{list-style:none;padding:0;margin:0;}
.ac-list li{padding:6px 0 6px 14px;border-left:3px solid #eee;margin-bottom:4px;font-size:12.5px;line-height:1.6;color:#555;}
.analysis-card.good .ac-list li{border-left-color:#bbf7d0;}
.analysis-card.bad .ac-list li{border-left-color:#fecaca;}
.analysis-card.delivery .ac-list li{border-left-color:#bfdbfe;}
.analysis-card.value .ac-list li{border-left-color:#fef08a;}
.analysis-card.tip .ac-list li{border-left-color:#ddd6fe;}
.analysis-card.diff .ac-list li{border-left-color:#99f6e4;}
.result-fallback{white-space:pre-wrap;line-height:1.8;font-size:13px;color:#333;padding:16px;background:#fafafa;border-radius:8px;border:1px solid #e0e0e0;}
@media(max-width:600px){.analysis-grid{grid-template-columns:1fr;}.review-header{flex-direction:column;text-align:center;}}
.step-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:#e8192c;color:#fff;border-radius:50%;font-size:11px;font-weight:700;}
@media(max-width:600px){.product-grid{grid-template-columns:repeat(2,1fr);}.sp-row{flex-direction:column;}}
</style>
</head>
<body>
<div class="page-header">
  <span class="page-title">상품 리뷰 분석기</span>
  <a class="home-btn" href="https://prettykbk81.github.io/hnsinfo/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/>
    </svg>
  </a>
</div>

<div class="wrap">
  <!-- STEP 1: 검색 -->
  <div class="section">
    <h2><span class="step-badge">1</span> 상품 검색</h2>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="상품명을 입력하세요 (예: 한라봉, 선풍기, 홍삼)" onkeypress="if(event.keyCode===13)searchProduct()">
      <button id="btnSearch" onclick="searchProduct()">검색</button>
    </div>
    <div class="hint">※ 홈앤쇼핑(hnsmall.com) 판매 상품을 검색합니다</div>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- STEP 2: 상품 정보 + 후기 -->
  <div class="section" id="step2" style="display:none;">
    <h2><span class="step-badge">2</span> 상품 정보 &amp; 블로그 후기</h2>
    <div class="selected-product" id="selectedProduct" style="display:block;">
      <div class="sp-row">
        <img class="sp-img" id="spImg" src="" alt="">
        <div class="sp-info">
          <div class="sp-name" id="spName"></div>
          <div class="sp-price" id="spPrice"></div>
          <div class="sp-score" id="spScore"></div>
          <div class="sp-reviews" id="spReviews"></div>
        </div>
      </div>
    </div>
    <div style="margin-top:14px;">
      <h2 style="font-size:13px;color:#555;margin-bottom:8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4z" stroke="#16a34a" stroke-width="2" rx="2"/><path d="M8 8h8M8 12h5" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/></svg>
        네이버 블로그 후기 <span id="blogCount" style="color:#aaa;font-weight:400;"></span>
      </h2>
      <div class="blog-list" id="blogList">
        <div class="ai-loading"><div class="ai-spinner"></div>블로그 후기를 검색 중...</div>
      </div>
    </div>
    <div style="text-align:center;">
      <button class="btn-analyze" id="btnAnalyze" onclick="analyzeReviews()" style="display:none;">AI 리뷰 다시 분석</button>
    </div>
  </div>

  <!-- STEP 3: 분석 결과 -->
  <div class="result" id="step3">
    <div id="resultBody"></div>
  </div>
</div>

<script>
var PROXY = 'http://localhost:8502';
var _selectedProduct = null;
var _blogReviews = [];

async function searchProduct() {
  var q = document.getElementById('searchInput').value.trim();
  if (!q) { alert('상품명을 입력해주세요.'); return; }
  var grid = document.getElementById('productGrid');
  var btn = document.getElementById('btnSearch');
  grid.innerHTML = '<div class="ai-loading"><div class="ai-spinner"></div>홈앤쇼핑에서 검색 중...</div>';
  btn.disabled = true; btn.textContent = '검색 중...';
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step3').style.display = 'none';

  try {
    var r = await fetch(PROXY + '/api/search-product?q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('프록시 연결 실패');
    var products = await r.json();
    if (!products.length) {
      grid.innerHTML = '<div style="padding:20px;color:#888;text-align:center;">검색 결과가 없습니다.</div>';
      return;
    }
    grid.innerHTML = products.map(function(p) {
      return '<div class="product-card" onclick=\'selectProduct(' + JSON.stringify(p).replace(/'/g,"&#39;") + ')\'>'
        + '<img src="' + p.image + '" alt="" onerror="this.src=\'https://via.placeholder.com/200?text=No+Image\'">'
        + '<div class="p-name">' + p.name + '</div>'
        + (p.price ? '<div class="p-price">' + p.price + '원</div>' : '')
        + '</div>';
    }).join('');
  } catch(e) {
    grid.innerHTML = '<div class="error">' +
      (e.message.indexOf('fetch') > -1 || e.message.indexOf('Failed') > -1
        ? 'streamlit run app.py 를 먼저 실행해주세요.'
        : e.message) + '</div>';
  } finally {
    btn.disabled = false; btn.textContent = '검색';
  }
}

async function selectProduct(product) {
  _selectedProduct = product;
  // 카드 선택 표시
  document.querySelectorAll('.product-card').forEach(function(c) { c.classList.remove('selected'); });
  event.currentTarget.classList.add('selected');

  // STEP 2 표시
  var step2 = document.getElementById('step2');
  step2.style.display = 'block';
  document.getElementById('spImg').src = product.image;
  document.getElementById('spName').textContent = product.name;
  document.getElementById('spPrice').textContent = product.price ? product.price + '원' : '';
  document.getElementById('spScore').textContent = '만족도 로딩 중...';
  document.getElementById('spReviews').textContent = '';
  document.getElementById('blogList').innerHTML = '<div class="ai-loading"><div class="ai-spinner"></div>후기를 수집 중...</div>';
  document.getElementById('step3').style.display = 'none';

  step2.scrollIntoView({behavior:'smooth', block:'start'});

  // 만족도 + 블로그 후기 동시 로드
  var scorePromise = fetch(PROXY + '/api/product-score?code=' + product.code).then(function(r){return r.json();}).catch(function(){return {};});
  var blogPromise = fetch(PROXY + '/api/search-reviews?q=' + encodeURIComponent('홈앤쇼핑 ' + product.name + ' 후기') + '&n=10').then(function(r){return r.json();}).catch(function(){return [];});

  var results = await Promise.all([scorePromise, blogPromise]);
  var score = results[0];
  var blogs = results[1];
  _blogReviews = blogs;

  _scoreData = score;
  if (score.score) {
    document.getElementById('spScore').innerHTML = '&#11088; 만족도 ' + score.score + '점 (' + score.level + ')';
    var distHtml = '상품평 ' + score.count + '건';
    if (score.distribution) {
      var labels = ['매우만족','만족','보통','불만족','매우불만족'];
      var colors = ['#16a34a','#22c55e','#eab308','#f97316','#dc2626'];
      var total = 0; labels.forEach(function(l){total += (score.distribution[l]||0);});
      if (total > 0) {
        distHtml += '<div style="display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin-top:6px;">';
        labels.forEach(function(l,i){
          var v = score.distribution[l]||0;
          if(v>0) distHtml += '<div style="width:'+((v/total)*100)+'%;background:'+colors[i]+';"></div>';
        });
        distHtml += '</div><div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;">';
        labels.forEach(function(l,i){
          var v = score.distribution[l]||0;
          if(v>0) distHtml += '<span style="font-size:10px;color:'+colors[i]+';font-weight:600;">'+l+' '+v+'</span>';
        });
        distHtml += '</div>';
      }
    }
    document.getElementById('spReviews').innerHTML = distHtml;
  } else {
    document.getElementById('spScore').textContent = '만족도 정보 없음';
  }

  // 블로그 후기 표시
  if (blogs.length) {
    document.getElementById('blogCount').textContent = '(' + blogs.length + '건)';
    document.getElementById('blogList').innerHTML = blogs.map(function(b) {
      return '<div class="blog-item">'
        + '<div class="b-title">' + b.title + '</div>'
        + '<div class="b-desc">' + b.desc + '</div>'
        + '<div class="b-meta">' + b.blogger + ' · ' + b.date + ' <a href="' + b.link + '" target="_blank" style="color:#e8192c;">원문 보기</a></div>'
        + '</div>';
    }).join('');
  } else {
    document.getElementById('blogCount').textContent = '(0건)';
    document.getElementById('blogList').innerHTML = '<div style="padding:16px;color:#888;text-align:center;">블로그 후기를 찾지 못했습니다.</div>';
  }

  // 자동으로 AI 분석 시작
  analyzeReviews();
}

var _scoreData = {};
var _retried = false;

async function analyzeReviews() {
  if (!_selectedProduct) return;
  var section = document.getElementById('step3');
  var body = document.getElementById('resultBody');
  var btn = document.getElementById('btnAnalyze');
  section.style.display = 'block';
  body.innerHTML = '<div class="section"><div class="ai-loading"><div class="ai-spinner"></div>Claude가 블로그 후기를 분석 중입니다...<br><span style="font-size:11px;color:#aaa;">본문을 읽고 장점/단점/배송/가성비를 정리합니다</span></div></div>';
  btn.disabled = true; btn.textContent = '분석 중...';
  section.scrollIntoView({behavior:'smooth', block:'start'});

  var reviewText = _blogReviews.map(function(b, i) {
    return '[후기' + (i+1) + '] ' + b.title + '\n' + b.desc;
  }).join('\n\n');

  var prompt = '당신은 홈쇼핑 상품 리뷰 분석 전문가입니다.\n\n';
  prompt += '상품명: ' + _selectedProduct.name + '\n판매처: 홈앤쇼핑\n';
  if (_scoreData.score) prompt += '홈앤쇼핑 만족도: ' + _scoreData.score + '점 (' + _scoreData.level + '), 상품평 ' + _scoreData.count + '건\n';
  prompt += '\n아래는 네이버 블로그에서 수집한 고객 후기 본문입니다:\n\n';
  prompt += reviewText || '(후기 없음 - 일반적 분석을 해주세요)';
  prompt += '\n\n위 후기를 분석하여 반드시 아래 JSON 형식으로만 응답하세요 (다른 텍스트 없이):\n';
  prompt += '{\n';
  prompt += '  "score": 4.2,\n';
  prompt += '  "summary": "종합 평가 한 줄 (30자 내외)",\n';
  prompt += '  "good": ["장점1 (구체적 후기 인용)", "장점2", "장점3"],\n';
  prompt += '  "bad": ["단점1", "단점2"],\n';
  prompt += '  "delivery": ["배송/포장 관련 의견1", "의견2"],\n';
  prompt += '  "value": ["가성비 관련 의견1", "의견2"],\n';
  prompt += '  "tip": ["MD 개선 제안1", "제안2", "제안3"]\n';
  prompt += '}\n';
  prompt += '규칙: score는 5점만점 소수점 1자리, good은 3~5개, bad/delivery/value는 2~3개, tip은 3개';

  try {
    var resp = await fetch(PROXY + '/api/summarize', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({prompt: prompt}),
    });
    if (!resp.ok) throw new Error('프록시 서버 연결 실패');

    var fullText = '';
    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';
    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, {stream:true});
      var lines = buffer.split('\n');
      buffer = lines.pop();
      for (var line of lines) {
        if (!line.startsWith('data: ')) continue;
        var p = line.slice(6);
        if (p === '[DONE]') break;
        try { fullText += JSON.parse(p).text; } catch(e) {}
      }
    }

    var analysis = tryParseReview(fullText);
    if (analysis) {
      renderAnalysis(analysis);
    } else if (!_retried) {
      _retried = true;
      setTimeout(analyzeReviews, 300);
      return;
    } else {
      body.innerHTML = '<div class="section"><div class="result-fallback">' + fullText.replace(/</g,'&lt;') + '</div></div>';
    }
  } catch(e) {
    body.innerHTML = '<div class="section"><div class="error">' +
      (e.message.indexOf('fetch')>-1 ? 'streamlit run app.py 를 먼저 실행해주세요.' : e.message) + '</div></div>';
  } finally {
    btn.disabled = false;
    btn.textContent = 'AI 리뷰 다시 분석';
    btn.style.display = 'inline-block';
    _retried = false;
  }
}

function tryParseReview(text) {
  var m = text.match(/\{[\s\S]*\}/);
  if (!m) return null;
  var raw = m[0].replace(/,\s*([\]}])/g,'$1');
  try { return JSON.parse(raw); } catch(e) {}
  var fixed = raw.replace(/:\s*"([^"]*)\n([^"]*)"(?=\s*[,\]}])/g, function(m,a,b){return ': "'+a+' '+b+'"';});
  try { return JSON.parse(fixed); } catch(e) {}
  return null;
}

function renderAnalysis(a) {
  var body = document.getElementById('resultBody');
  var stars = '';
  var full = Math.floor(a.score||0);
  var half = (a.score||0) - full >= 0.5;
  for(var i=0;i<5;i++) stars += i<full?'★':(i===full&&half?'★':'☆');

  var html = '';
  // 종합 헤더
  html += '<div class="review-header">';
  html += '<div class="rh-score">'+(a.score||'?')+'<small>/5</small></div>';
  html += '<div class="rh-info"><div class="rh-stars">'+stars+'</div>';
  html += '<h3>'+(a.summary||'')+'</h3>';
  html += '<p>블로그 후기 '+_blogReviews.length+'건 분석 기반</p></div></div>';

  // 카드 그리드
  html += '<div class="analysis-grid">';
  html += makeCard('good','👍','장점','#16a34a', a.good);
  html += makeCard('bad','👎','단점','#dc2626', a.bad);
  html += makeCard('delivery','📦','배송/포장','#2563eb', a.delivery);
  html += makeCard('value','💰','가성비','#d97706', a.value);
  html += '</div>';

  // MD 제안 (풀 폭)
  html += '<div class="section" style="margin-top:0;">';
  html += '<h2 style="color:#7c3aed;"><span style="margin-right:6px;">💡</span>MD 개선 제안</h2>';
  html += '<ul style="list-style:none;padding:0;">';
  (a.tip||[]).forEach(function(t,i){
    html += '<li style="padding:10px 14px;margin-bottom:6px;background:#f5f3ff;border-radius:6px;border-left:4px solid #7c3aed;font-size:13px;color:#444;">';
    html += '<strong style="color:#7c3aed;">'+(i+1)+'.</strong> '+esc(t)+'</li>';
  });
  html += '</ul></div>';

  body.innerHTML = html;
}

function makeCard(cls, icon, title, color, items) {
  var h = '<div class="analysis-card '+cls+'">';
  h += '<div class="ac-header"><div class="ac-icon '+cls+'">'+icon+'</div>';
  h += '<div class="ac-title">'+title+'</div></div>';
  h += '<ul class="ac-list">';
  (items||['분석 데이터 없음']).forEach(function(it){ h += '<li>'+esc(it)+'</li>'; });
  h += '</ul></div>';
  return h;
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
