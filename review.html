<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 리뷰&상품평 분석 · 홈앤쇼핑 AI</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#eaeaea;color:#333;font-size:13px;}
.page-header{background:#fff;padding:13px 20px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:2px solid #ddd;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.page-title{font-size:16px;font-weight:700;color:#111;}
.home-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);text-decoration:none;color:#444;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:6px;}
.home-btn:hover{background:#f0f0f0;color:#e8192c;}
.wrap{max-width:960px;margin:24px auto;padding:0 16px;}
.section{background:#fff;border-radius:10px;padding:24px 28px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.section h2{font-size:14px;font-weight:700;color:#e8192c;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.search-bar{display:flex;gap:8px;}
.search-bar input{flex:1;padding:10px 14px;border:2px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;}
.search-bar input:focus{outline:none;border-color:#e8192c;}
.search-bar button{background:#e8192c;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;}
.search-bar button:hover{background:#c8001f;} .search-bar button:disabled{background:#999;cursor:not-allowed;}
.hint{font-size:11px;color:#999;margin-top:6px;}
.ai-loading{text-align:center;padding:30px;color:#888;}
.ai-spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:#e8192c;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.error{color:#c0392b;font-weight:600;padding:16px;text-align:center;}
.step-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:#e8192c;color:#fff;border-radius:50%;font-size:11px;font-weight:700;}

/* 상품 리스트 */
.product-list{margin-top:16px;}
.product-row{display:flex;gap:14px;padding:14px;border:1.5px solid #eee;border-radius:10px;margin-bottom:10px;align-items:center;background:#fff;transition:border-color .15s;}
.product-row:hover{border-color:#e8192c;}
.pr-img{width:80px;height:80px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#f5f5f5;}
.pr-info{flex:1;min-width:0;}
.pr-name{font-size:13px;font-weight:700;color:#111;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pr-price{font-size:14px;font-weight:800;color:#e8192c;margin-bottom:4px;}
.pr-score-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pr-score{font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;}
.pr-score.high{background:#f0fdf4;color:#16a34a;}
.pr-score.mid{background:#fffbeb;color:#d97706;}
.pr-score.low{background:#fef2f2;color:#dc2626;}
.pr-score.none{background:#f5f5f5;color:#999;}
.pr-count{font-size:11px;color:#888;}
.pr-dist{display:flex;gap:1px;height:6px;border-radius:3px;overflow:hidden;width:120px;}
.pr-loading{font-size:11px;color:#aaa;font-style:italic;}

/* 종합 분석 결과 */
.summary-header{background:linear-gradient(135deg,#e8192c,#c8001f);color:#fff;padding:24px 28px;border-radius:10px;margin-bottom:14px;}
.summary-header h1{font-size:20px;font-weight:800;margin-bottom:4px;}
.summary-header p{font-size:12px;opacity:.75;}
.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.analysis-card{background:#fff;border-radius:10px;padding:18px 20px;box-shadow:0 1px 6px rgba(0,0,0,.06);border-top:3px solid #ddd;}
.analysis-card.good{border-top-color:#16a34a;} .analysis-card.bad{border-top-color:#dc2626;}
.analysis-card.delivery{border-top-color:#2563eb;} .analysis-card.value{border-top-color:#d97706;}
.ac-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.ac-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.ac-icon.good{background:#f0fdf4;} .ac-icon.bad{background:#fef2f2;}
.ac-icon.delivery{background:#eff6ff;} .ac-icon.value{background:#fffbeb;}
.ac-title{font-size:13px;font-weight:700;color:#333;}
.ac-list{list-style:none;padding:0;margin:0;}
.ac-list li{padding:5px 0 5px 12px;border-left:3px solid #eee;margin-bottom:3px;font-size:12px;line-height:1.6;color:#555;}
.analysis-card.good .ac-list li{border-left-color:#bbf7d0;}
.analysis-card.bad .ac-list li{border-left-color:#fecaca;}
.analysis-card.delivery .ac-list li{border-left-color:#bfdbfe;}
.analysis-card.value .ac-list li{border-left-color:#fef08a;}
/* 히트맵 */
.heatmap-wrap{background:#fff;border-radius:10px;padding:18px 22px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:14px;overflow-x:auto;}
.heatmap-wrap h3{font-size:13px;font-weight:700;color:#7c3aed;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.heatmap-wrap .hm-sub{font-size:10px;color:#999;margin-bottom:12px;}
.hm-table{border-collapse:collapse;font-size:10px;width:100%;min-width:700px;}
.hm-table th{padding:4px 2px;font-weight:600;color:#888;text-align:center;position:sticky;top:0;background:#fff;}
.hm-table th:first-child{text-align:left;min-width:90px;font-size:11px;color:#333;}
.hm-table td{padding:3px 1px;text-align:center;font-size:9px;color:#555;border:1px solid #f5f5f5;}
.hm-table td:first-child{text-align:left;font-size:10px;font-weight:600;color:#333;padding-left:4px;border:none;white-space:nowrap;}
.hm-table .hm-total{font-weight:700;color:#7c3aed;background:#f5f3ff;}
.tip-section{background:#fff;border-radius:10px;padding:18px 22px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:14px;}
.tip-section h3{font-size:13px;font-weight:700;color:#7c3aed;margin-bottom:10px;}
.tip-item{padding:8px 12px;margin-bottom:5px;background:#f5f3ff;border-radius:6px;border-left:4px solid #7c3aed;font-size:12px;color:#444;}
.result-fallback{white-space:pre-wrap;line-height:1.7;font-size:13px;color:#333;padding:16px;background:#fafafa;border-radius:8px;border:1px solid #e0e0e0;}
/* 편성표 */
.sch-list{max-height:320px;overflow-y:auto;border:1.5px solid #e0e0e0;border-radius:8px;background:#fafafa;}
.sch-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #eee;cursor:pointer;transition:background .1s;}
.sch-item:hover{background:#fff5f5;}
.sch-item:last-child{border-bottom:none;}
.sch-time{font-size:12px;font-weight:700;color:#0369a1;min-width:90px;flex-shrink:0;}
.sch-time .live{color:#e8192c;}
.sch-img{width:50px;height:50px;border-radius:6px;object-fit:cover;flex-shrink:0;background:#eee;}
.sch-name{font-size:12.5px;font-weight:600;color:#333;flex:1;}
.sch-pick{font-size:10px;color:#e8192c;font-weight:700;white-space:nowrap;}
@media(max-width:600px){.analysis-grid{grid-template-columns:1fr;}.product-row{flex-wrap:wrap;}}
</style>
</head>
<body>
<div class="page-header">
  <span class="page-title">상품 리뷰&상품평 분석</span>
  <a class="home-btn" href="https://prettykbk81.github.io/hnsinfo/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/>
    </svg>
  </a>
</div>

<div class="wrap">
  <div class="section">
    <h2><span class="step-badge">1</span> 상품 검색</h2>
    <div style="margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button id="btnSchedule" onclick="loadSchedule()" style="background:#0369a1;color:#fff;border:none;padding:9px 18px;border-radius:6px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;">
        📺 오늘 방송 편성표
      </button>
      <button onclick="toggleProductSearch()" style="background:#e8192c;color:#fff;border:none;padding:9px 18px;border-radius:6px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;">
        🔍 상품 검색
      </button>
      <span style="font-size:11px;color:#999;">상품을 클릭하면 자동으로 검색됩니다</span>
    </div>
    <div id="scheduleArea" style="display:none;margin-bottom:14px;"></div>
    <div id="productSearchArea" style="display:none;margin-bottom:14px;">
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <input type="text" id="productSearchQuery" placeholder="홈앤쇼핑 상품명 검색 (예: 홍삼, 선풍기)" style="flex:1;padding:9px 12px;border:2px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;" onkeypress="if(event.keyCode===13)searchProductList()">
        <button onclick="searchProductList()" style="background:#e8192c;color:#fff;border:none;padding:9px 18px;border-radius:6px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;">검색</button>
      </div>
      <div id="productSearchResults" style="max-height:300px;overflow-y:auto;border:1.5px solid #e0e0e0;border-radius:8px;background:#fafafa;"></div>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="검색어를 입력하세요 (예: 홍삼, 선풍기, 한라봉)" onkeypress="if(event.keyCode===13)searchAll()">
      <button id="btnSearch" onclick="searchAll()">검색 &amp; 분석</button>
    </div>
    <div class="hint">※ 홈앤쇼핑 상품 검색 → 각 상품 만족도 수집 → 블로그 후기 분석까지 한번에 진행됩니다</div>
  </div>

  <div id="resultArea"></div>
</div>

<script>
var PROXY = 'http://localhost:8502';

function toggleProductSearch() {
  var area = document.getElementById('productSearchArea');
  if (area.style.display === 'none') {
    area.style.display = 'block';
    document.getElementById('productSearchQuery').focus();
    document.getElementById('scheduleArea').style.display = 'none';
  } else {
    area.style.display = 'none';
  }
}

async function searchProductList() {
  var q = document.getElementById('productSearchQuery').value.trim();
  if (!q) return;
  var results = document.getElementById('productSearchResults');
  results.innerHTML = '<div style="text-align:center;padding:20px;color:#888;"><div class="ai-spinner"></div>검색 중...</div>';
  try {
    var r = await fetch(PROXY + '/api/search-product?q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('연결 실패');
    var products = await r.json();
    if (!products.length) { results.innerHTML = '<div style="padding:16px;color:#888;text-align:center;">검색 결과가 없습니다.</div>'; return; }
    var html = '';
    products.forEach(function(p) {
      html += '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer;transition:background .1s;" onmouseover="this.style.background=\'#fff5f5\'" onmouseout="this.style.background=\'transparent\'" onclick="pickProduct(\'' + esc(p.name).replace(/'/g,"\\'") + '\')">';
      html += '<img src="' + p.image + '" style="width:50px;height:50px;border-radius:6px;object-fit:cover;" onerror="this.style.display=\'none\'">';
      html += '<div style="flex:1;min-width:0;"><div style="font-size:12.5px;font-weight:600;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(p.name) + '</div>';
      if (p.price) html += '<div style="font-size:12px;color:#e8192c;font-weight:700;">' + p.price + '원</div>';
      html += '</div>';
      html += '<div style="font-size:10px;color:#e8192c;font-weight:700;flex-shrink:0;">선택 →</div>';
      html += '</div>';
    });
    results.innerHTML = html;
  } catch(e) {
    results.innerHTML = '<div style="padding:16px;color:#c0392b;text-align:center;">검색 실패. proxy.py 실행 여부를 확인하세요.</div>';
  }
}

function pickProduct(name) {
  document.getElementById('searchInput').value = name;
  document.getElementById('productSearchArea').style.display = 'none';
  searchAll();
}

async function loadSchedule() {
  var area = document.getElementById('scheduleArea');
  var btn = document.getElementById('btnSchedule');
  if (area.style.display === 'block') { area.style.display = 'none'; return; }
  area.style.display = 'block';
  area.innerHTML = '<div class="ai-loading"><div class="ai-spinner"></div>편성표를 불러오는 중...</div>';
  btn.disabled = true;
  try {
    var r = await fetch(PROXY + '/api/schedule');
    if (!r.ok) throw new Error('연결 실패');
    var items = await r.json();
    if (!items.length) { area.innerHTML = '<div style="padding:16px;color:#888;text-align:center;">편성표 데이터가 없습니다.</div>'; return; }

    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();

    var html = '<div class="sch-list">';
    items.forEach(function(it) {
      var tParts = it.time_start.split(':');
      var startMin = parseInt(tParts[0]) * 60 + parseInt(tParts[1]);
      var eParts = it.time_end.split(':');
      var endMin = parseInt(eParts[0]) * 60 + parseInt(eParts[1]);
      var isLive = nowMin >= startMin && nowMin < endMin;

      html += '<div class="sch-item" onclick="pickScheduleItem(\'' + esc(it.name).replace(/'/g,"\\'") + '\')">';
      html += '<div class="sch-time">' + (isLive ? '<span class="live">● LIVE </span>' : '') + it.time_start + ' ~ ' + it.time_end + '</div>';
      if (it.image) html += '<img class="sch-img" src="' + it.image + '" onerror="this.style.display=\'none\'">';
      html += '<div class="sch-name">' + esc(it.name) + '</div>';
      html += '<div class="sch-pick">선택 →</div>';
      html += '</div>';
    });
    html += '</div>';
    area.innerHTML = html;
  } catch(e) {
    area.innerHTML = '<div class="error">편성표를 불러올 수 없습니다. streamlit run app.py를 먼저 실행해주세요.</div>';
  } finally {
    btn.disabled = false;
  }
}

function pickScheduleItem(name) {
  document.getElementById('searchInput').value = name;
  document.getElementById('scheduleArea').style.display = 'none';
  searchAll();
}

var DIST_COLORS = {'매우만족':'#16a34a','만족':'#22c55e','보통':'#eab308','불만족':'#f97316','매우불만족':'#dc2626'};

async function searchAll() {
  var q = document.getElementById('searchInput').value.trim();
  if (!q) { alert('검색어를 입력해주세요.'); return; }
  var area = document.getElementById('resultArea');
  var btn = document.getElementById('btnSearch');
  btn.disabled = true; btn.textContent = '검색 중...';
  area.innerHTML = '<div class="section"><div class="ai-loading"><div class="ai-spinner"></div>홈앤쇼핑에서 상품을 검색하고 있습니다...</div></div>';

  try {
    // 1. 상품 검색 + 같은 카테고리만 필터링
    var r = await fetch(PROXY + '/api/search-product?q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('프록시 연결 실패');
    var allProducts = await r.json();
    if (!allProducts.length) { area.innerHTML = '<div class="section" style="text-align:center;color:#888;padding:40px;">검색 결과가 없습니다.</div>'; return; }

    // 검색어 키워드 매칭 + 첫 상품 기준 카테고리 필터링
    var qWords = q.replace(/[[\]()]/g,'').split(/\s+/).filter(function(w){return w.length>=2;});

    // 키워드 매칭 먼저
    var matched = allProducts.filter(function(p) {
      var name = (p.name||'').toLowerCase();
      return qWords.some(function(w){return name.indexOf(w.toLowerCase())>-1;});
    });
    if (!matched.length) matched = allProducts;

    // 첫 상품의 핵심 키워드를 기준으로 유사 상품만 필터
    var firstName = (matched[0].name||'').replace(/[\[\]()A-Z+]/g,' ');
    var catWords = firstName.split(/\s+/).filter(function(w){
      return w.length >= 2 && !['추가','증정','특집','특가','세트','패키지','총','팩','개','입','롤','장'].includes(w);
    }).slice(0,3);

    var products = matched;
    if (catWords.length > 0) {
      var filtered = matched.filter(function(p) {
        var name = (p.name||'').toLowerCase();
        return catWords.some(function(w){return name.indexOf(w.toLowerCase())>-1;});
      });
      if (filtered.length >= 2) products = filtered;
    }
    if (!products.length) products = allProducts;

    // 2. 상품 리스트 렌더 (로딩 상태)
    area.innerHTML = '<div class="section"><h2><span class="step-badge">2</span> 검색된 상품 (' + products.length + '개) — 만족도 수집 중...</h2><div class="product-list" id="productList"></div></div><div id="analysisArea"></div>';
    var list = document.getElementById('productList');
    products.forEach(function(p, i) {
      list.innerHTML += '<div class="product-row" id="pr-' + i + '">'
        + '<img class="pr-img" src="' + p.image + '" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect fill=%22%23f5f5f5%22 width=%2280%22 height=%2280%22/><text x=%2240%22 y=%2244%22 text-anchor=%22middle%22 fill=%22%23ccc%22 font-size=%2212%22>No Image</text></svg>\'">'
        + '<div class="pr-info">'
        + '<div class="pr-name">' + esc(p.name) + '</div>'
        + (p.price ? '<div class="pr-price">' + p.price + '원</div>' : '')
        + '<div class="pr-score-wrap" id="score-' + i + '"><span class="pr-loading">만족도 로딩 중...</span></div>'
        + '</div></div>';
    });

    // 3. 각 상품 만족도 병렬 수집
    var scorePromises = products.map(function(p) {
      return fetch(PROXY + '/api/product-score?code=' + p.code).then(function(r){return r.json();}).catch(function(){return {};});
    });
    var scores = await Promise.all(scorePromises);

    scores.forEach(function(sc, i) {
      var el = document.getElementById('score-' + i);
      if (!el) return;
      if (sc.score) {
        var cls = parseInt(sc.score) >= 80 ? 'high' : parseInt(sc.score) >= 60 ? 'mid' : 'low';
        var html = '<span class="pr-score ' + cls + '">' + sc.score + '점 ' + (sc.level||'') + '</span>';
        var countNum = parseInt((sc.count||'0').replace(/,/g,''));
        var countLabel = countNum >= 10000 ? (countNum/10000).toFixed(1)+'만' : (countNum>=1000 ? (countNum/1000).toFixed(1)+'천' : sc.count);
        html += '<span class="pr-count" style="font-weight:700;color:#0369a1;">상품평 ' + countLabel + '건</span>';
        if (sc.distribution) {
          var total = 0;
          Object.values(sc.distribution).forEach(function(v){total+=v;});
          if (total > 0) {
            html += '<div class="pr-dist">';
            ['매우만족','만족','보통','불만족','매우불만족'].forEach(function(l){
              var v = sc.distribution[l]||0;
              if(v>0) html += '<div style="width:'+((v/total)*100)+'%;background:'+(DIST_COLORS[l]||'#ccc')+';"></div>';
            });
            html += '</div>';
          }
        }
        el.innerHTML = html;
      } else {
        el.innerHTML = '<span class="pr-score none">만족도 정보 없음</span>';
      }
      products[i]._score = sc;
    });

    // 4. 블로그 후기 수집 + AI 분석
    document.querySelector('#resultArea .section h2').innerHTML = '<span class="step-badge">2</span> 검색된 상품 (' + products.length + '개)';
    var analysisArea = document.getElementById('analysisArea');
    analysisArea.innerHTML = '<div class="section"><div class="ai-loading"><div class="ai-spinner"></div>홈앤쇼핑 상품평 + 블로그 후기를 종합 분석 중...</div></div>';

    var blogR = await fetch(PROXY + '/api/search-reviews?q=' + encodeURIComponent('홈앤쇼핑 ' + q + ' 후기 리뷰') + '&n=10');
    var blogs = await blogR.json();

    // 상품별 요약 + 홈앤쇼핑 상품평 데이터
    var promptData = products.map(function(p, i) {
      var sc = p._score || {};
      var line = (i+1) + '. ' + p.name + ' (' + (p.price||'가격미정') + '원)';
      if (sc.score) {
        line += ' — 만족도 ' + sc.score + '점(' + sc.level + '), 상품평 ' + sc.count + '건';
        if (sc.distribution) {
          var distParts = [];
          ['매우만족','만족','보통','불만족','매우불만족'].forEach(function(k){
            if(sc.distribution[k]) distParts.push(k+' '+sc.distribution[k]+'건');
          });
          if (distParts.length) line += ' [' + distParts.join(', ') + ']';
        }
      }
      return line;
    }).join('\n');

    var blogText = blogs.map(function(b, i) {
      return '[블로그' + (i+1) + '] ' + b.title + '\n' + b.desc;
    }).join('\n\n');

    var prompt = '당신은 홈쇼핑 상품 리뷰&상품평 분석 전문가입니다.\n\n';
    prompt += '검색어: "' + q + '"\n\n';
    prompt += '홈앤쇼핑 상품 목록 및 상품평 (만족도/건수):\n' + promptData + '\n\n';
    prompt += '네이버 블로그 후기:\n' + blogText + '\n\n';
    prompt += '위 정보를 종합 분석하여 반드시 아래 JSON으로만 응답하세요:\n';
    prompt += '{\n';
    prompt += '  "summary": "전체 종합 평가 (40자 내외)",\n';
    prompt += '  "best_pick": "가장 추천 상품명 1개",\n';
    prompt += '  "best_reason": "추천 이유 (30자 내외)",\n';
    prompt += '  "satisfaction": {"만족":15,"불만족":3},\n';
    prompt += '  "categories": [\n';
    prompt += '    {"name":"품질","satisfied":8,"dissatisfied":1,"good":"맛이 좋고 신선하다","bad":"간혹 품질 편차"},\n';
    prompt += '    {"name":"가격","satisfied":6,"dissatisfied":2,"good":"가격이 저렴하고 가성비 좋다","bad":"타사 대비 약간 비싸다"},\n';
    prompt += '    {"name":"배송","satisfied":7,"dissatisfied":3,"good":"배송이 빠르고 포장이 꼼꼼","bad":"배송이 늦는 경우가 있다"},\n';
    prompt += '    {"name":"구성","satisfied":5,"dissatisfied":1,"good":"구성품이 알차다","bad":"수량이 적다"},\n';
    prompt += '    {"name":"재구매","satisfied":6,"dissatisfied":0,"good":"재구매 의향 높음","bad":""}\n';
    prompt += '  ],\n';
    prompt += '  "good": ["장점1 (후기 인용)", "장점2", "장점3"],\n';
    prompt += '  "bad": ["단점1", "단점2"],\n';
    prompt += '  "tip": ["MD 개선제안1", "제안2", "제안3"]\n';
    prompt += '}\n';
    prompt += '규칙: categories의 satisfied/dissatisfied는 후기에서 추정한 건수. good/bad는 대표 의견 요약.';

    var aiR = await fetch(PROXY + '/api/summarize', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt:prompt}),
    });
    var fullText = '';
    var reader = aiR.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';
    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, {stream:true});
      var lines = buffer.split('\n');
      buffer = lines.pop();
      for (var line of lines) {
        if (!line.startsWith('data: ')) continue;
        var p = line.slice(6);
        if (p === '[DONE]') break;
        try { fullText += JSON.parse(p).text; } catch(e) {}
      }
    }

    var analysis = tryParse(fullText);
    if (analysis) {
      renderAnalysis(analysis, q, products.length, blogs.length);
    } else if (!window._reviewRetried) {
      window._reviewRetried = true;
      analysisArea.innerHTML = '<div class="section"><div class="ai-loading"><div class="ai-spinner"></div>파싱 오류, 자동 재시도 중...</div></div>';
      setTimeout(function(){ searchAll(); }, 500);
      return;
    } else {
      analysisArea.innerHTML = '<div class="section"><div class="error">분석 결과 파싱 실패. 다시 검색해주세요.</div></div>';
      window._reviewRetried = false;
    }

  } catch(e) {
    area.innerHTML = '<div class="section"><div class="error">' +
      (e.message.indexOf('fetch')>-1||e.message.indexOf('Failed')>-1 ? 'streamlit run app.py 를 먼저 실행해주세요.' : esc(e.message)) + '</div></div>';
  } finally {
    btn.disabled = false; btn.textContent = '검색 & 분석';
  }
}

function tryParse(text) {
  // ```json 블록 제거
  var cleaned = text.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
  var m = cleaned.match(/\{[\s\S]*\}/);
  if (!m) return null;
  var raw = m[0];
  // 1차
  try { return JSON.parse(raw); } catch(e) {}
  // 2차: trailing comma
  raw = raw.replace(/,\s*([\]}])/g,'$1');
  try { return JSON.parse(raw); } catch(e) {}
  // 3차: 줄바꿈 문자열
  raw = raw.replace(/"([^"]*)\n([^"]*)"/g, function(m,a,b){return '"'+a+' '+b+'"';});
  try { return JSON.parse(raw); } catch(e) {}
  // 4차: 닫는 괄호 복구
  var opens = (raw.match(/[\[{]/g)||[]).length;
  var closes = (raw.match(/[\]}]/g)||[]).length;
  for (var i=0; i<opens-closes; i++) {
    var last = Math.max(raw.lastIndexOf('['), raw.lastIndexOf('{'));
    raw += (raw[last]==='[') ? ']' : '}';
  }
  raw = raw.replace(/,\s*([\]}])/g,'$1');
  try { return JSON.parse(raw); } catch(e) {}
  return null;
}

function renderAnalysis(a, query, productCount, blogCount) {
  var area = document.getElementById('analysisArea');
  var html = '';

  // 종합 헤더
  html += '<div class="summary-header">';
  html += '<h1>"' + esc(query) + '" 종합 리뷰 분석</h1>';
  html += '<p>홈앤쇼핑 상품 ' + productCount + '개 + 블로그 후기 ' + blogCount + '건 분석</p>';
  html += '<p style="margin-top:8px;font-size:13px;opacity:.9;">' + esc(a.summary||'') + '</p>';
  if (a.best_pick) {
    html += '<div style="margin-top:10px;padding:8px 14px;background:rgba(255,255,255,.15);border-radius:6px;display:inline-block;">';
    html += '<span style="font-size:11px;opacity:.7;">BEST PICK</span><br>';
    html += '<strong style="font-size:15px;">🏆 ' + esc(a.best_pick) + '</strong>';
    if (a.best_reason) html += '<span style="font-size:12px;opacity:.8;margin-left:8px;">' + esc(a.best_reason) + '</span>';
    html += '</div>';
  }
  html += '</div>';

  // 만족/불만족 총계
  if (a.satisfaction) {
    var sat = a.satisfaction['만족'] || 0;
    var dis = a.satisfaction['불만족'] || 0;
    var total = sat + dis;
    var satPct = total > 0 ? Math.round(sat/total*100) : 100;
    html += '<div style="display:flex;gap:14px;margin-bottom:14px;">';
    html += '<div style="flex:1;background:#fff;border-radius:10px;padding:16px 20px;box-shadow:0 1px 6px rgba(0,0,0,.06);text-align:center;border-top:3px solid #16a34a;">';
    html += '<div style="font-size:28px;font-weight:900;color:#16a34a;">'+sat+'<span style="font-size:14px;font-weight:600;">건</span></div>';
    html += '<div style="font-size:12px;color:#888;">만족 ('+satPct+'%)</div></div>';
    html += '<div style="flex:1;background:#fff;border-radius:10px;padding:16px 20px;box-shadow:0 1px 6px rgba(0,0,0,.06);text-align:center;border-top:3px solid #dc2626;">';
    html += '<div style="font-size:28px;font-weight:900;color:#dc2626;">'+dis+'<span style="font-size:14px;font-weight:600;">건</span></div>';
    html += '<div style="font-size:12px;color:#888;">불만족 ('+(100-satPct)+'%)</div></div>';
    html += '</div>';
  }

  // 항목별 분석 테이블
  if (a.categories && a.categories.length) {
    html += '<div style="background:#fff;border-radius:10px;padding:18px 20px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:14px;">';
    html += '<div style="font-size:13px;font-weight:700;color:#333;margin-bottom:12px;">📋 항목별 만족/불만족 분석</div>';
    html += '<table style="width:100%;border-collapse:collapse;font-size:12px;">';
    html += '<tr style="background:#f8f8f8;"><th style="padding:8px 10px;text-align:left;border-bottom:2px solid #ddd;">항목</th><th style="padding:8px;border-bottom:2px solid #ddd;text-align:center;color:#16a34a;">만족</th><th style="padding:8px;border-bottom:2px solid #ddd;text-align:center;color:#dc2626;">불만족</th><th style="padding:8px;border-bottom:2px solid #ddd;">만족 의견</th><th style="padding:8px;border-bottom:2px solid #ddd;">불만족 의견</th></tr>';
    a.categories.forEach(function(c) {
      var barTotal = (c.satisfied||0) + (c.dissatisfied||0);
      var barPct = barTotal > 0 ? Math.round((c.satisfied||0)/barTotal*100) : 100;
      html += '<tr>';
      html += '<td style="padding:8px 10px;border-bottom:1px solid #eee;font-weight:700;">'+esc(c.name)+'<div style="height:4px;background:#eee;border-radius:2px;margin-top:4px;"><div style="height:100%;width:'+barPct+'%;background:linear-gradient(90deg,#16a34a,#22c55e);border-radius:2px;"></div></div></td>';
      html += '<td style="padding:8px;border-bottom:1px solid #eee;text-align:center;font-weight:700;color:#16a34a;">'+(c.satisfied||0)+'건</td>';
      html += '<td style="padding:8px;border-bottom:1px solid #eee;text-align:center;font-weight:700;color:#dc2626;">'+(c.dissatisfied||0)+'건</td>';

  if (a.tip && a.tip.length) {
    var tipIcons = ['🎯','🚀','💎','⭐','🔥'];
    var tipColors = ['#7c3aed','#2563eb','#e8192c'];
    html += '<div style="background:#fff;border-radius:10px;padding:22px 24px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:14px;border-top:3px solid #7c3aed;">';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">';
    html += '<div style="font-size:15px;font-weight:800;color:#7c3aed;display:flex;align-items:center;gap:6px;">💡 MD 개선 제안</div>';
    html += '<span style="font-size:10px;color:#dc2626;font-weight:700;background:#fef2f2;padding:3px 8px;border-radius:4px;">※ 상품 리뷰 기반 AI 분석 제안</span>';
    html += '</div>';
    a.tip.forEach(function(t, i) {
      var icon = tipIcons[i] || '💡';
      var color = tipColors[i % tipColors.length];
      html += '<div style="display:flex;gap:14px;padding:16px 18px;margin-bottom:10px;background:linear-gradient(135deg,#f5f3ff,#eff6ff);border-radius:10px;border-left:4px solid '+color+';align-items:flex-start;">';
      html += '<div style="font-size:28px;flex-shrink:0;line-height:1;">'+icon+'</div>';
      html += '<div style="flex:1;">';
      html += '<div style="font-size:10px;font-weight:700;color:'+color+';letter-spacing:.5px;margin-bottom:4px;">SUGGESTION '+(i+1)+'</div>';
      html += '<div style="font-size:13px;color:#333;line-height:1.7;font-weight:600;">'+esc(t)+'</div>';
      html += '</div></div>';
    });
    html += '</div>';
  }


  area.innerHTML = html;
  area.scrollIntoView({behavior:'smooth', block:'start'});
}

  try {

function renderPriceCharts(data) {
  var priceColors = ['#eab308','#22c55e','#3b82f6','#a855f7','#ec4899'];
  var priceLabels = ['~3만','3~10만','10~30만','30~100만','100만+'];

  // 1. 가격대 분포 바 차트
  try {
    if (data.price_dist) {
      var labels = Object.keys(data.price_dist);
      var values = Object.values(data.price_dist);
      var ctx = document.getElementById('chartPriceDist');
      if (ctx) {
        _reviewCharts.push(new Chart(ctx.getContext('2d'), {
          type:'bar',
          data:{labels:labels, datasets:[{data:values, backgroundColor:priceColors.slice(0,labels.length), borderRadius:4}]},
          options:{responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,grid:{color:'#f0f0f0'}},x:{grid:{display:false}}}}
        }));
      }
    }
  } catch(e){}

  // 2. 가격대 × 채널 누적 바 차트
  try {
    if (data.price_by_channel && data.price_by_channel.length) {
      var chNames = data.price_by_channel.map(function(c){return c.name;});
      var datasets = priceLabels.map(function(label, idx) {
        return {
          label: label,
          data: data.price_by_channel.map(function(c){return (c.p||[])[idx]||0;}),
          backgroundColor: priceColors[idx],
          borderRadius: 2,
        };
      });
      var ctx2 = document.getElementById('chartPriceChannel');
      if (ctx2) {
        _reviewCharts.push(new Chart(ctx2.getContext('2d'), {
          type:'bar',
          data:{labels:chNames, datasets:datasets},
          options:{responsive:true, plugins:{legend:{position:'top',labels:{font:{size:10}}}}, scales:{x:{stacked:true,ticks:{font:{size:9}}},y:{stacked:true,beginAtZero:true,grid:{color:'#f0f0f0'}}}}
        }));
      }
    }
  } catch(e){}
}

function renderHeatmap(data) {
  var channels = data.channels || [];
  if (!channels.length) return;

  var html = '<h3>📺 시간 × 채널 편성 히트맵</h3>';
  html += '<div class="hm-sub">최근 1개월 편성 추정 · 셀 진할수록 편성 多 · AI 분석 데이터</div>';
  html += '<table class="hm-table"><tr><th></th>';
  for (var h=0; h<24; h++) html += '<th>'+h+'</th>';
  html += '<th class="hm-total">합계</th></tr>';

  var maxVal = 0;
  channels.forEach(function(ch) {
    (ch.hours||[]).forEach(function(v){if(v>maxVal)maxVal=v;});
  });

  channels.forEach(function(ch) {
    var hours = ch.hours || [];
    var total = hours.reduce(function(a,b){return a+b;},0);
    html += '<tr><td>' + esc(ch.name) + '</td>';
    for (var h=0; h<24; h++) {
      var v = hours[h] || 0;
      var intensity = maxVal > 0 ? v / maxVal : 0;
      var bg = v === 0 ? '#fff' : 'rgba(124,58,237,' + (0.08 + intensity * 0.55) + ')';
      var color = intensity > 0.6 ? '#fff' : '#555';
      html += '<td style="background:'+bg+';color:'+color+';">'+(v||'')+'</td>';
    }
    html += '<td class="hm-total">'+total+'</td></tr>';
  });

  html += '</table>';
  document.getElementById('heatmapArea').innerHTML = html;
}

function makeCard(cls, icon, title, items) {
  var h = '<div class="analysis-card ' + cls + '">';
  h += '<div class="ac-header"><div class="ac-icon ' + cls + '">' + icon + '</div>';
  h += '<div class="ac-title">' + title + '</div></div>';
  h += '<ul class="ac-list">';
  (items||['분석 데이터 없음']).forEach(function(it){ h += '<li>' + esc(it) + '</li>'; });
  h += '</ul></div>';
  return h;
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
