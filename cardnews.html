<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈앤쇼핑 AI DAILY NEWS</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#d4d0c8;
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:32px 20px 48px;
  font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
}
.page-label { font-size:12px; font-weight:700; color:#cc2b2b; letter-spacing:2.5px; margin-bottom:4px; text-align:center; }
.page-date  { font-size:11px; color:#777; letter-spacing:1px; margin-bottom:30px; text-align:center; }

/* ── 2열 그리드 ── */
.grid-wrap {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
  width:100%; max-width:1860px;
}
.col { display:flex; flex-direction:column; gap:20px; }
.col-header {
  font-size:11px; font-weight:700; color:#fff;
  background:#cc2b2b; letter-spacing:1.5px;
  padding:6px 14px; align-self:flex-start;
}

/* ── 카드 ── */
.card {
  background:#f0e9d8; padding:36px 44px 28px;
  display:flex; flex-direction:column;
  box-shadow:0 4px 24px rgba(0,0,0,.15);
}
.c-top      { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; }
.c-handle   { font-size:10px; font-weight:700; color:#cc2b2b; letter-spacing:.8px; margin-bottom:2px; }
.c-category { font-size:12px; color:#5a4a3a; }
.c-date     { font-size:10px; color:#9a8a7a; letter-spacing:1px; }
.c-title    { font-size:36px; font-weight:900; color:#111; line-height:1.1; letter-spacing:-1px; margin-bottom:28px; }
.c-title .hl { color:#cc2b2b; }
.c-items    { display:flex; flex-direction:column; gap:4px; }
.c-item     { display:flex; align-items:center; padding:11px 0 11px 18px; border-left:4px solid #cc2b2b; }
.i-num      { font-size:22px; font-weight:900; color:#cc2b2b; width:42px; flex-shrink:0; line-height:1; }
.i-kw       { font-size:14px; font-weight:700; color:#111; width:160px; flex-shrink:0; }
.i-desc     { font-size:12.5px; color:#666; flex:1; }
.i-desc b   { color:#cc2b2b; font-weight:700; }
.i-desc em  { color:#111; font-style:normal; font-weight:700; }
.c-divider  { border:none; border-top:1px solid #c8bdb0; margin:20px 0 12px; }
.c-footer   { display:flex; justify-content:space-between; align-items:center; }
.c-foot-text { font-size:12px; font-weight:700; color:#222; }
.c-credit    { font-size:10px; color:#9a8a7a; }
.c-sources   { margin-top:10px; padding-top:8px; border-top:1px dashed #d0c4b4; }
.c-sources-label { font-size:9px; font-weight:700; color:#9a8a7a; letter-spacing:.8px; margin-bottom:5px; }
.c-sources a {
  display:inline-flex; align-items:center; gap:3px;
  font-size:11px; color:#cc2b2b;
  text-decoration:underline; text-underline-offset:2px;
  margin-right:12px; line-height:2; cursor:pointer;
}
.c-sources a::after { content:'↗'; font-size:9px; opacity:.7; }
.c-sources a:hover { color:#a01f1f; opacity:.85; }

/* ── 로딩/에러 ── */
.status { text-align:center; padding:60px 20px; font-size:15px; color:#888; grid-column:1/-1; }
.spinner {
  width:36px; height:36px; border:3px solid #ddd;
  border-top-color:#cc2b2b; border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 16px;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── 컨트롤 ── */
.ctrl {
  margin-top:24px; display:flex; gap:10px;
  align-items:center; flex-wrap:wrap; justify-content:center;
}
.btn-home, .btn-print, .btn-refresh {
  padding:8px 20px; border:none; border-radius:5px;
  font-size:13px; font-family:inherit; cursor:pointer;
}
.btn-home {
  background:#e8192c; color:#fff;
  display:inline-flex; align-items:center; gap:6px; text-decoration:none;
}
.btn-home:hover    { background:#c8001f; }
.btn-print         { background:#333; color:#fff; }
.btn-print:hover   { background:#111; }
.btn-generate       { background:#1a7f37; color:#fff; }
.btn-generate:hover { background:#14632b; }
.btn-generate:disabled { background:#888; cursor:not-allowed; }
.btn-refresh       { background:#555; color:#fff; }
.btn-refresh:hover { background:#333; }

@media (max-width:900px) { .grid-wrap { grid-template-columns:1fr; } }
@media print {
  body { background:none; padding:0; }
  .ctrl, .page-label, .page-date { display:none; }
  .card { box-shadow:none; page-break-after:always; }
}
</style>
</head>
<body>

<div class="page-label">@홈앤쇼핑_AI_DAILY_NEWS</div>
<div class="page-date" id="pageDate">네이버 뉴스 × Claude AI</div>

<div class="grid-wrap" id="wrap">
  <div class="status"><div class="spinner"></div>최신 뉴스 카드를 불러오는 중입니다…</div>
</div>

<div class="ctrl">
  <a class="btn-home" href="https://prettykbk81.github.io/hnsinfo/">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9,22 9,12 15,12 15,22"/>
    </svg>
    홈으로
  </a>
  <button class="btn-generate" id="btnGenerate" onclick="generateNews()">⚡ 뉴스 새로 생성</button>
  <button class="btn-refresh" onclick="loadNews()">↻ 새로고침</button>
  <button class="btn-print" onclick="window.print()">🖨️ 인쇄 / PDF</button>
</div>
<div id="statusMsg" style="margin-top:12px;font-size:12px;color:#888;text-align:center;min-height:18px;"></div>

<script src="portal_config.js"></script>
<script>
/* ── GitHub Actions 트리거 ── */
function generateNews() {
  var cfg = window.PORTAL_CONFIG;
  var btn = document.getElementById('btnGenerate');
  var msg = document.getElementById('statusMsg');

  if (!cfg || !cfg.GITHUB_TOKEN || cfg.GITHUB_TOKEN.indexOf('여기에') !== -1) {
    window.open(
      'https://github.com/prettykbk81/hnsinfo/actions/workflows/daily_news.yml',
      '_blank'
    );
    msg.textContent = 'GitHub Actions 페이지에서 Run workflow를 클릭하세요.';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ 생성 중...';
  msg.textContent = 'GitHub Actions 워크플로우를 시작합니다...';

  var apiBase = 'https://api.github.com/repos/' + cfg.GITHUB_OWNER + '/' + cfg.GITHUB_REPO;
  var headers  = {
    'Authorization': 'Bearer ' + cfg.GITHUB_TOKEN,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  };

  fetch(apiBase + '/actions/workflows/' + cfg.WORKFLOW_FILE + '/dispatches', {
    method: 'POST',
    headers: Object.assign({'Content-Type': 'application/json'}, headers),
    body: JSON.stringify({ref: 'main'}),
  })
  .then(function(r) {
    if (!r.ok) throw new Error('워크플로우 시작 실패 (HTTP ' + r.status + ')');
    msg.textContent = '워크플로우 시작됨. 완료까지 약 1~2분 소요됩니다...';
    return pollWorkflow(apiBase, headers, 0);
  })
  .then(function() {
    msg.textContent = '완료! 새 뉴스를 불러옵니다...';
    setTimeout(function() { loadNews(); msg.textContent = ''; }, 2000);
  })
  .catch(function(err) {
    msg.textContent = '오류: ' + err.message;
  })
  .finally(function() {
    btn.disabled = false;
    btn.textContent = '⚡ 뉴스 새로 생성';
  });
}

function pollWorkflow(apiBase, headers, attempts) {
  if (attempts > 24) return Promise.resolve(); // 최대 2분 대기
  return new Promise(function(resolve) { setTimeout(resolve, 5000); })
    .then(function() {
      return fetch(apiBase + '/actions/runs?per_page=1&event=workflow_dispatch', {headers: headers});
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var run = data.workflow_runs && data.workflow_runs[0];
      if (!run) return pollWorkflow(apiBase, headers, attempts + 1);
      var status = run.status;
      var conclusion = run.conclusion;
      document.getElementById('statusMsg').textContent =
        '워크플로우 상태: ' + status + (conclusion ? ' / ' + conclusion : '') + ' (' + (attempts * 5) + '초 경과)';
      if (status === 'completed') return Promise.resolve();
      return pollWorkflow(apiBase, headers, attempts + 1);
    });
}

function makeCard(card, dateEn) {
  var items = (card.items || []).map(function(it, i) {
    return '<div class="c-item">'
      + '<span class="i-num">' + (i+1) + '</span>'
      + '<span class="i-kw">'  + (it.keyword||'') + '</span>'
      + '<span class="i-desc">'+ (it.desc||'') + '</span>'
      + '</div>';
  }).join('');

  var sources = '';
  if (card.sources && card.sources.length) {
    var links = card.sources.map(function(s) {
      return '<a href="'+s.url+'" target="_blank" rel="noopener">'+s.title+'</a>';
    }).join('');
    sources = '<div class="c-sources"><div class="c-sources-label">출처 SOURCE</div>'+links+'</div>';
  }

  return '<div class="card">'
    + '<div class="c-top">'
      + '<div><div class="c-handle">@홈앤쇼핑_AI_DAILY_NEWS</div>'
      + '<div class="c-category">'+(card.category||'')+'</div></div>'
      + '<div class="c-date">'+(dateEn||'')+'</div>'
    + '</div>'
    + '<div class="c-title">'+(card.title||'')+'</div>'
    + '<div class="c-items">'+items+'</div>'
    + '<hr class="c-divider">'
    + '<div class="c-footer">'
      + '<div class="c-foot-text">'+(card.footer||'')+'</div>'
      + '<div class="c-credit">© 홈앤쇼핑 AI Daily · powered by Claude</div>'
    + '</div>'
    + sources
    + '</div>';
}

function renderCards(data) {
  document.getElementById('pageDate').textContent =
    (data.date || '') + ' · 네이버 뉴스 × Claude AI';

  var left  = (data.left  || data.cards || []).slice(0,3);
  var right = (data.right || []).slice(0,3);
  var dateEn = data.date_en || '';

  var leftHtml  = left.map(function(c)  { return makeCard(c, dateEn); }).join('');
  var rightHtml = right.map(function(c) { return makeCard(c, dateEn); }).join('');

  var wrap = document.getElementById('wrap');
  if (right.length) {
    wrap.innerHTML =
      '<div class="col"><div class="col-header">홈앤쇼핑 자사 뉴스</div>' + leftHtml + '</div>'
      + '<div class="col"><div class="col-header">홈쇼핑 업계 동향</div>' + rightHtml + '</div>';
  } else {
    wrap.innerHTML = '<div class="col" style="grid-column:1/-1">' + leftHtml + '</div>';
  }
}

function loadNews() {
  var wrap = document.getElementById('wrap');
  wrap.innerHTML = '<div class="status"><div class="spinner"></div>최신 뉴스 카드를 불러오는 중입니다…</div>';

  fetch('daily_news.json?t=' + Date.now())
    .then(function(r) { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(renderCards)
    .catch(function(err) {
      wrap.innerHTML = '<div class="status">뉴스를 불러오지 못했습니다.<br>'
        + '<small style="color:#aaa">'+err.message+'</small><br><br>'
        + '<a href="daily_news.html" style="color:#cc2b2b">daily_news.html 바로가기</a></div>';
    });
}

loadNews();
</script>
</body>
</html>
