name: AI Daily News 자동 생성

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 KST 08:00 (UTC 23:00 = KST+9 08:00)
  workflow_dispatch:         # 수동 실행 (테스트용)

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install anthropic httpx requests urllib3 playwright

      - name: Playwright 브라우저 설치
        run: playwright install chromium --with-deps

      - name: 카드뉴스 생성
        run: python generate_news.py
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID:      ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:  ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: daily_news 커밋 & 푸시
        uses: EndBug/add-and-commit@v9
        with:
          message: 'AI Daily News 자동 업데이트'
          add: 'daily_news.html daily_news.json shopping_insight.json'
          default_author: github_actions

      - name: 카드 이미지 생성 & 이메일 발송
        if: success()
        run: python cards_to_email.py
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: bk.kang@hnsmall.com
        continue-on-error: true

      - name: Notion 업데이트
        if: success()
        run: python notion_update.py
        env:
          NOTION_TOKEN:   ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: "37c3ffb91ddd8038bf96fce111328dbc"
        continue-on-error: true
