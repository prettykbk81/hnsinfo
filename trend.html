<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈쇼핑 트렌드 리포트 · 홈앤쇼핑 AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#eaeaea;color:#333;font-size:13px;}
.page-header{background:#fff;padding:13px 20px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:2px solid #ddd;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.page-title{font-size:16px;font-weight:700;color:#111;}
.home-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);text-decoration:none;color:#444;display:flex;align-items:center;width:34px;height:34px;border-radius:6px;transition:background .15s;justify-content:center;}
.home-btn:hover{background:#f0f0f0;color:#e8192c;}
.wrap{max-width:920px;margin:24px auto;padding:0 16px;}
.section{background:#fff;border-radius:10px;padding:24px 28px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.section h2{font-size:14px;font-weight:700;color:#0d9488;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.cat-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.cat-chip{padding:8px 18px;border:2px solid #ddd;border-radius:20px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;background:#fff;transition:all .15s;color:#555;}
.cat-chip:hover{border-color:#0d9488;color:#0d9488;}
.cat-chip.active{background:#0d9488;color:#fff;border-color:#0d9488;}
.focus-input{margin-bottom:14px;}
.focus-input input{width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;}
.focus-input input:focus{outline:none;border-color:#0d9488;}
.btn-area{text-align:center;margin-top:14px;}
.btn-run{background:#0d9488;color:#fff;border:none;padding:12px 36px;border-radius:6px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}
.btn-run:hover{background:#0a766d;} .btn-run:disabled{background:#999;cursor:not-allowed;}
.news-source{margin-top:14px;padding:12px 16px;background:#f0fdfa;border-radius:6px;font-size:11px;color:#0d9488;line-height:1.6;border:1px solid #99f6e4;}
.ai-loading{text-align:center;padding:40px;color:#888;}
.ai-spinner{width:32px;height:32px;border:3px solid #ddd;border-top-color:#0d9488;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.error{color:#c0392b;font-weight:600;padding:16px;text-align:center;}

/* 리포트 헤더 */
.report-header{background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff;padding:28px 32px;border-radius:10px;margin-bottom:16px;}
.report-header h1{font-size:22px;font-weight:800;margin-bottom:4px;}
.report-header .rh-date{font-size:12px;opacity:.7;}
.report-header .rh-summary{font-size:14px;margin-top:10px;line-height:1.7;opacity:.9;}

/* 트렌드 TOP 카드 */
.trend-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.trend-card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,.06);border-top:3px solid #0d9488;position:relative;}
.trend-card .tc-rank{position:absolute;top:12px;right:14px;font-size:28px;font-weight:900;color:rgba(13,148,136,.12);}
.trend-card .tc-label{font-size:10px;font-weight:700;color:#0d9488;letter-spacing:.5px;margin-bottom:6px;}
.trend-card .tc-title{font-size:15px;font-weight:800;color:#111;margin-bottom:8px;line-height:1.3;}
.trend-card .tc-desc{font-size:12px;color:#666;line-height:1.6;}

/* 분석 섹션 */
.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.analysis-card{background:#fff;border-radius:10px;padding:20px 22px;box-shadow:0 1px 6px rgba(0,0,0,.06);border-left:4px solid #ddd;}
.analysis-card.industry{border-left-color:#2563eb;} .analysis-card.competitor{border-left-color:#dc2626;}
.analysis-card.consumer{border-left-color:#d97706;} .analysis-card.insight{border-left-color:#7c3aed;}
.ac-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.ac-icon{font-size:20px;}
.ac-title{font-size:14px;font-weight:700;color:#333;}
.ac-list{list-style:none;padding:0;margin:0;}
.ac-list li{padding:6px 0 6px 14px;border-left:3px solid #e0e0e0;margin-bottom:4px;font-size:12.5px;line-height:1.6;color:#555;}
.analysis-card.industry .ac-list li{border-left-color:#bfdbfe;}
.analysis-card.competitor .ac-list li{border-left-color:#fecaca;}
.analysis-card.consumer .ac-list li{border-left-color:#fef08a;}
.analysis-card.insight .ac-list li{border-left-color:#ddd6fe;}

/* 시사점 */
.insight-section{background:#fff;border-radius:10px;padding:20px 24px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:16px;}
.insight-section h3{font-size:14px;font-weight:700;color:#7c3aed;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.insight-item{display:flex;gap:12px;padding:12px 14px;margin-bottom:8px;background:#f5f3ff;border-radius:8px;border-left:4px solid #7c3aed;}
.insight-num{font-size:22px;font-weight:900;color:#7c3aed;flex-shrink:0;width:30px;}
.insight-text{font-size:13px;color:#444;line-height:1.6;}

/* 다음주 */
.nextweek{background:#fff;border-radius:10px;padding:20px 24px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:16px;border-top:3px solid #0d9488;}
.nextweek h3{font-size:14px;font-weight:700;color:#0d9488;margin-bottom:10px;}
.nextweek ul{list-style:none;padding:0;}
.nextweek li{padding:6px 0;font-size:13px;color:#444;display:flex;align-items:flex-start;gap:6px;}
.nextweek li::before{content:'▸';color:#0d9488;font-weight:700;flex-shrink:0;}

.report-footer{text-align:center;font-size:10px;color:#aaa;padding:12px 0;}
.result-fallback{white-space:pre-wrap;line-height:1.7;font-size:13px;color:#333;padding:16px;background:#fafafa;border-radius:8px;border:1px solid #e0e0e0;}

/* 시장 분석 대시보드 */
.market-dash{margin-bottom:16px;}
.market-metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px;}
.mm-card{background:#fff;border-radius:8px;padding:12px 10px;box-shadow:0 1px 4px rgba(0,0,0,.05);text-align:center;border-top:2px solid #0d9488;}
.mm-value{font-size:18px;font-weight:900;color:#0d9488;}
.mm-value.red{color:#dc2626;} .mm-value.blue{color:#2563eb;}
.mm-label{font-size:9px;color:#888;margin-top:2px;}
.mm-sub{font-size:8px;color:#bbb;}
.market-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.mc-box{background:#fff;border-radius:8px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.mc-box h4{font-size:12px;font-weight:700;color:#333;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.mc-box h4 .badge-api{font-size:8px;color:#0d9488;background:#f0fdfa;padding:2px 6px;border-radius:3px;font-weight:600;}
.mc-bar{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px;}
.mc-bar-label{width:70px;text-align:right;color:#555;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mc-bar-fill{height:16px;background:#0d9488;border-radius:3px;min-width:2px;transition:width .4s;}
.mc-bar-val{color:#888;font-size:10px;min-width:25px;}
.trend-line-box{background:#fff;border-radius:8px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:14px;}
.trend-line-box h4{font-size:12px;font-weight:700;color:#333;margin-bottom:8px;}

@media(max-width:700px){.trend-cards,.analysis-grid{grid-template-columns:1fr;}.market-metrics{grid-template-columns:repeat(3,1fr);}.market-charts{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="page-header">
  <span class="page-title">홈쇼핑 트렌드 리포트</span>
  <a class="home-btn" href="https://prettykbk81.github.io/hnsinfo/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/>
    </svg>
  </a>
</div>

<div class="wrap">
  <div class="section">
    <h2>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      트렌드 분석 설정
    </h2>
    <label style="margin-bottom:8px;font-weight:600;color:#555;">관심 업종 (복수 선택 가능)</label>
    <div class="cat-chips" id="chips">
      <button class="cat-chip active" data-cat="전체">전체</button>
      <button class="cat-chip" data-cat="식품/건강">식품/건강</button>
      <button class="cat-chip" data-cat="뷰티/스킨케어">뷰티</button>
      <button class="cat-chip" data-cat="패션/의류">패션</button>
      <button class="cat-chip" data-cat="생활가전">생활가전</button>
      <button class="cat-chip" data-cat="라이브커머스">라이브커머스</button>
    </div>
    <div class="focus-input">
      <label for="focusTopic" style="font-weight:600;color:#555;">추가 관심 키워드 (선택)</label>
      <input type="text" id="focusTopic" placeholder="예) MZ세대, 프리미엄, 가성비">
    </div>
    <div class="btn-area">
      <button class="btn-run" id="btnRun" onclick="analyzeTrend()">트렌드 리포트 생성</button>
    </div>
    <div class="news-source" id="newsSource" style="display:none;"></div>
  </div>

  <!-- 시장 분석 대시보드 -->
  <div id="marketDash" style="display:none;"></div>

  <!-- 검색 트렌드 차트 -->
  <div id="trendLineArea" style="display:none;"></div>

  <div id="resultArea"></div>
</div>

<script>
var PROXY = 'http://localhost:8502';

document.getElementById('chips').addEventListener('click', function(e) {
  var chip = e.target.closest('.cat-chip');
  if (!chip) return;
  if (chip.dataset.cat === '전체') {
    document.querySelectorAll('.cat-chip').forEach(function(c){c.classList.remove('active');});
    chip.classList.add('active');
  } else {
    document.querySelector('.cat-chip[data-cat="전체"]').classList.remove('active');
    chip.classList.toggle('active');
    if (!document.querySelector('.cat-chip.active'))
      document.querySelector('.cat-chip[data-cat="전체"]').classList.add('active');
  }
});

async function analyzeTrend() {
  var cats = [];
  document.querySelectorAll('.cat-chip.active').forEach(function(c){cats.push(c.dataset.cat);});
  var focus = document.getElementById('focusTopic').value.trim();
  var area = document.getElementById('resultArea');
  var btn = document.getElementById('btnRun');
  var newsSource = document.getElementById('newsSource');
  btn.disabled = true; btn.textContent = '분석 중...';
  area.innerHTML = '<div class="section"><div class="ai-loading"><div class="ai-spinner"></div>뉴스 데이터를 불러오고 트렌드를 분석 중입니다...</div></div>';

  // 시장 분석 대시보드 (병렬 로드)
  var searchKeyword = focus || (cats.indexOf('전체')>-1 ? '홈쇼핑' : cats.join(' '));
  loadMarketDash(searchKeyword);

  // daily_news.json에서 뉴스 데이터 로드
  var newsContext = '';
  var newsDate = '';
  try {
    var newsResp = await fetch('daily_news.json?t=' + Date.now());
    if (newsResp.ok) {
      var newsData = await newsResp.json();
      newsDate = newsData.date || '';
      var allCards = (newsData.left || []).concat(newsData.right || []);
      newsContext = allCards.map(function(c) {
        var items = (c.items || []).map(function(it){return it.keyword+': '+(it.desc||'').replace(/<[^>]+>/g,'');}).join('\n');
        var sources = (c.sources||[]).map(function(s){return s.title;}).join(', ');
        return '[' + c.category + '] ' + (c.title||'').replace(/<br>/g,' ') + '\n' + items + (sources ? '\n출처: '+sources : '');
      }).join('\n\n');
      newsSource.innerHTML = '📰 <b>뉴스 데이터:</b> ' + newsDate + ' 기준 카드뉴스 ' + allCards.length + '건 기반 분석';
      newsSource.style.display = 'block';
    }
  } catch(e) {}

  if (!newsDate) {
    var d = new Date();
    newsDate = d.getFullYear() + '년 ' + ('0'+(d.getMonth()+1)).slice(-2) + '월 ' + ('0'+d.getDate()).slice(-2) + '일';
  }

  var prompt = '당신은 홈쇼핑/이커머스 산업 트렌드 분석 전문가입니다.\n';
  prompt += '오늘 날짜: ' + newsDate + '\n';
  prompt += '반드시 ' + newsDate + ' 기준으로 작성하세요. 2024년이 아닙니다.\n\n';

  if (newsContext) {
    prompt += '아래는 ' + newsDate + ' 홈쇼핑 관련 최신 뉴스입니다. 이 뉴스를 기반으로 분석하세요:\n\n' + newsContext + '\n\n';
  }

  prompt += '분석 대상 업종: ' + cats.join(', ') + '\n';
  if (focus) prompt += '추가 관심 키워드: ' + focus + '\n';
  prompt += '\n반드시 아래 JSON 형식으로만 응답하세요 (다른 텍스트 없이):\n';
  prompt += '{\n';
  prompt += '  "date": "' + newsDate + '",\n';
  prompt += '  "summary": "이번 주 홈쇼핑 업계 종합 요약 (50자 내외)",\n';
  prompt += '  "trends": [\n';
  prompt += '    {"rank":1, "title":"트렌드 제목 (15자)", "desc":"설명 (60자 내외, 수치와 사례 포함)"},\n';
  prompt += '    {"rank":2, "title":"트렌드 제목", "desc":"설명"},\n';
  prompt += '    {"rank":3, "title":"트렌드 제목", "desc":"설명"},\n';
  prompt += '    {"rank":4, "title":"트렌드 제목", "desc":"설명"}\n';
  prompt += '  ],\n';
  prompt += '  "industry": ["업종별 동향1 (뉴스 기반 구체적)", "동향2", "동향3"],\n';
  prompt += '  "competitor": ["경쟁사 움직임1", "움직임2", "움직임3"],\n';
  prompt += '  "consumer": ["소비자 트렌드1", "트렌드2", "트렌드3"],\n';
  prompt += '  "insights": [\n';
  prompt += '    {"title":"시사점 제목 (10자)", "desc":"홈앤쇼핑에 대한 전략적 시사점 (40자)"},\n';
  prompt += '    {"title":"시사점2", "desc":"설명"},\n';
  prompt += '    {"title":"시사점3", "desc":"설명"}\n';
  prompt += '  ],\n';
  prompt += '  "monthly_search": {"4월":65,"5월":78,"6월":92},\n';
  prompt += '  "age_distribution": {"10대":5,"20대":15,"30대":25,"40대":28,"50대":18,"60대이상":9},\n';
  prompt += '  "channel_share": {"TV홈쇼핑":35,"라이브커머스":25,"온라인몰":22,"모바일앱":18},\n';
  prompt += '  "next_week": ["다음 주 주목할 포인트1", "포인트2", "포인트3"]\n';
  prompt += '}\n';
  prompt += '규칙:\n- 뉴스 기사 실제 내용과 수치를 인용\n- trends는 4개\n- monthly_search: 최근 3개월 월별 검색 관심도 (추정)\n- age_distribution: 홈쇼핑 구매 고객 연령 비율 추정\n- channel_share: 채널별 구매 비율 추정\n- 날짜는 ' + newsDate + ' 기준';

  try {
    var resp = await fetch(PROXY + '/api/summarize', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt:prompt}),
    });
    if (!resp.ok) throw new Error('프록시 연결 실패');

    var fullText = '';
    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';
    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, {stream:true});
      var lines = buffer.split('\n');
      buffer = lines.pop();
      for (var line of lines) {
        if (!line.startsWith('data: ')) continue;
        var p = line.slice(6);
        if (p === '[DONE]') break;
        try { fullText += JSON.parse(p).text; } catch(e) {}
      }
    }

    var report = tryParse(fullText);
    if (report) {
      renderReport(report);
    } else {
      area.innerHTML = '<div class="section"><div class="result-fallback">' + esc(fullText) + '</div></div>';
    }
  } catch(e) {
    area.innerHTML = '<div class="section"><div class="error">' +
      (e.message.indexOf('fetch')>-1 ? 'proxy.py가 실행되지 않았습니다.' : esc(e.message)) + '</div></div>';
  } finally {
    btn.disabled = false; btn.textContent = '트렌드 리포트 생성';
  }
}

function tryParse(text) {
  var m = text.match(/\{[\s\S]*\}/);
  if (!m) return null;
  var raw = m[0].replace(/,\s*([\]}])/g,'$1');
  try { return JSON.parse(raw); } catch(e) {}
  raw = raw.replace(/:\s*"([^"]*)\n([^"]*)"(?=\s*[,\]}])/g, function(m,a,b){return ': "'+a+' '+b+'"';});
  try { return JSON.parse(raw); } catch(e) {}
  return null;
}

function renderReport(r) {
  var area = document.getElementById('resultArea');
  var html = '';

  // 헤더
  html += '<div class="report-header">';
  html += '<div class="rh-date">TREND REPORT · ' + esc(r.date||'') + '</div>';
  html += '<h1>홈쇼핑 트렌드 리포트</h1>';
  html += '<div class="rh-summary">' + esc(r.summary||'') + '</div>';
  html += '</div>';

  // TOP 3 트렌드
  if (r.trends && r.trends.length) {
    html += '<div class="trend-cards">';
    r.trends.forEach(function(t) {
      html += '<div class="trend-card">';
      html += '<div class="tc-rank">#' + t.rank + '</div>';
      html += '<div class="tc-label">TREND #' + t.rank + '</div>';
      html += '<div class="tc-title">' + esc(t.title||'') + '</div>';
      html += '<div class="tc-desc">' + esc(t.desc||'') + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  // 4섹션 그리드
  html += '<div class="analysis-grid">';
  html += makeSection('industry', '📊', '업종별 동향', r.industry);
  html += makeSection('competitor', '🏢', '경쟁사 움직임', r.competitor);
  html += makeSection('consumer', '👥', '소비자 트렌드', r.consumer);
  html += '</div>';

  // 전략적 시사점
  if (r.insights && r.insights.length) {
    html += '<div class="insight-section"><h3>💡 홈앤쇼핑 전략적 시사점</h3>';
    r.insights.forEach(function(ins, i) {
      html += '<div class="insight-item">';
      html += '<div class="insight-num">' + (i+1) + '</div>';
      html += '<div class="insight-text"><strong>' + esc(ins.title||'') + '</strong><br>' + esc(ins.desc||'') + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  // 차트 영역 (3개)
  var hasChartData = r.monthly_search || r.age_distribution || r.channel_share;
  if (hasChartData) {
    html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;" id="aiChartsRow">';
    if (r.monthly_search) {
      html += '<div style="background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);">';
      html += '<div style="font-size:12px;font-weight:700;color:#333;margin-bottom:8px;">📈 월별 검색 관심도 추이</div>';
      html += '<canvas id="chartMonthly" height="180"></canvas></div>';
    }
    if (r.age_distribution) {
      html += '<div style="background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);">';
      html += '<div style="font-size:12px;font-weight:700;color:#333;margin-bottom:8px;">👥 구매 고객 연령 분포</div>';
      html += '<canvas id="chartAge" height="180"></canvas></div>';
    }
    if (r.channel_share) {
      html += '<div style="background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);">';
      html += '<div style="font-size:12px;font-weight:700;color:#333;margin-bottom:8px;">📺 채널별 구매 비율</div>';
      html += '<canvas id="chartChannel" height="180"></canvas></div>';
    }
    html += '</div>';
  }

  // 다음 주
  if (r.next_week && r.next_week.length) {
    html += '<div class="nextweek"><h3>📅 다음 주 주목 포인트</h3><ul>';
    r.next_week.forEach(function(n) { html += '<li>' + esc(n) + '</li>'; });
    html += '</ul></div>';
  }

  html += '<div class="report-footer">홈앤쇼핑 AI 트렌드 리포트 · 네이버 뉴스 × Claude AI · ' + esc(r.date||'') + '</div>';
  area.innerHTML = html;
  area.scrollIntoView({behavior:'smooth'});

  // AI 생성 차트 렌더링
  var chartColors = ['#0d9488','#2563eb','#e8192c','#d97706','#7c3aed','#16a34a'];
  try {
    if (r.monthly_search) {
      var mLabels = Object.keys(r.monthly_search);
      var mValues = Object.values(r.monthly_search);
      var ctx1 = document.getElementById('chartMonthly');
      if (ctx1) new Chart(ctx1.getContext('2d'), {
        type:'bar', data:{labels:mLabels, datasets:[{label:'검색 관심도',data:mValues,backgroundColor:chartColors.slice(0,mLabels.length),borderRadius:6}]},
        options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#f0f0f0'}},x:{grid:{display:false}}}}
      });
    }
    if (r.age_distribution) {
      var aLabels = Object.keys(r.age_distribution);
      var aValues = Object.values(r.age_distribution);
      var ctx2 = document.getElementById('chartAge');
      if (ctx2) new Chart(ctx2.getContext('2d'), {
        type:'doughnut', data:{labels:aLabels, datasets:[{data:aValues,backgroundColor:chartColors,borderWidth:2,borderColor:'#fff'}]},
        options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}}}
      });
    }
    if (r.channel_share) {
      var cLabels = Object.keys(r.channel_share);
      var cValues = Object.values(r.channel_share);
      var ctx3 = document.getElementById('chartChannel');
      if (ctx3) new Chart(ctx3.getContext('2d'), {
        type:'pie', data:{labels:cLabels, datasets:[{data:cValues,backgroundColor:chartColors,borderWidth:2,borderColor:'#fff'}]},
        options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}}}
      });
    }
  } catch(e) { console.log('차트 오류:', e); }
}

function makeSection(cls, icon, title, items) {
  var h = '<div class="analysis-card ' + cls + '">';
  h += '<div class="ac-header"><div class="ac-icon">' + icon + '</div>';
  h += '<div class="ac-title">' + title + '</div></div>';
  h += '<ul class="ac-list">';
  (items||['데이터 없음']).forEach(function(it){ h += '<li>' + esc(it) + '</li>'; });
  h += '</ul></div>';
  return h;
}

var _trendCharts = [];

async function loadMarketDash(keyword) {
  var dash = document.getElementById('marketDash');
  var trendArea = document.getElementById('trendLineArea');
  dash.style.display = 'block';
  dash.innerHTML = '<div class="section"><div class="ai-loading"><div class="ai-spinner"></div>네이버 쇼핑 API로 시장 데이터 수집 중...</div></div>';

  try {
    // 쇼핑 검색 + DataLab 병렬
    var [shopResp, trendResp] = await Promise.all([
      fetch(PROXY + '/api/shop-search?q=' + encodeURIComponent(keyword) + '&n=100').then(function(r){return r.json();}),
      fetch(PROXY + '/api/datalab-trend?q=' + encodeURIComponent(keyword)).then(function(r){return r.json();}),
    ]);

    if (shopResp && shopResp.total) renderMarketDash(shopResp, keyword);
    else dash.style.display = 'none';

    if (trendResp && trendResp.labels) renderTrendLine(trendResp);
    else trendArea.style.display = 'none';
  } catch(e) {
    dash.style.display = 'none';
  }
}

function renderMarketDash(d, keyword) {
  var dash = document.getElementById('marketDash');
  var html = '<div class="market-dash">';

  // 메트릭 카드 6개
  html += '<div style="font-size:13px;font-weight:700;color:#0d9488;margin-bottom:8px;display:flex;align-items:center;gap:6px;"><span style="background:#0d9488;color:#fff;padding:2px 8px;border-radius:4px;font-size:10px;">네이버 쇼핑 API</span> "'+esc(keyword)+'" 검색어 시장 분석</div>';
  html += '<div class="market-metrics">';
  html += mmCard(d.total ? d.total.toLocaleString()+'건' : '-', '총 검색건수', '수집 '+Math.min(d.total||0,100)+'개', '');
  html += mmCard(d.avg_price ? d.avg_price.toLocaleString()+'원' : '-', '평균 가격', '중간값 기반', 'blue');
  html += mmCard(d.min_price ? d.min_price.toLocaleString()+'원' : '-', '최저가', '', '');
  html += mmCard(d.brand_count+'개', '브랜드 수', '', '');
  html += mmCard(d.mall_count+'개', '쇼핑몰 수', '', '');
  html += mmCard(d.max_price ? d.max_price.toLocaleString()+'원' : '-', '최고가', '', 'red');
  html += '</div>';

  // 차트 4개 (2x2)
  html += '<div class="market-charts">';

  // 가격대 분포
  html += '<div class="mc-box"><h4>💰 가격대별 상품 분포 <span class="badge-api">실시간</span></h4>';
  var pb = d.price_buckets || {};
  var pbMax = Math.max.apply(null, Object.values(pb).concat([1]));
  Object.keys(pb).forEach(function(k){
    var v = pb[k];
    html += '<div class="mc-bar"><span class="mc-bar-label">'+k+'</span><div class="mc-bar-fill" style="width:'+Math.round(v/pbMax*100)+'%;background:#0d9488;"></div><span class="mc-bar-val">'+v+'</span></div>';
  });
  html += '</div>';

  // Top 10 쇼핑몰
  html += '<div class="mc-box"><h4>🏪 Top 10 쇼핑몰별 상품 수 <span class="badge-api">실시간</span></h4>';
  var tmMax = (d.top_malls && d.top_malls[0]) ? d.top_malls[0].count : 1;
  (d.top_malls||[]).forEach(function(m){
    html += '<div class="mc-bar"><span class="mc-bar-label">'+esc(m.name)+'</span><div class="mc-bar-fill" style="width:'+Math.round(m.count/tmMax*100)+'%;background:#16a34a;"></div><span class="mc-bar-val">'+m.count+'</span></div>';
  });
  html += '</div>';

  // 카테고리 분포
  html += '<div class="mc-box"><h4>📂 카테고리 분포 <span class="badge-api">실시간</span></h4>';
  var cats = d.categories || {};
  var catMax = Math.max.apply(null, Object.values(cats).concat([1]));
  Object.keys(cats).slice(0,8).forEach(function(k){
    html += '<div class="mc-bar"><span class="mc-bar-label">'+esc(k)+'</span><div class="mc-bar-fill" style="width:'+Math.round(cats[k]/catMax*100)+'%;background:#2563eb;"></div><span class="mc-bar-val">'+cats[k]+'</span></div>';
  });
  html += '</div>';

  // Top 10 브랜드
  html += '<div class="mc-box"><h4>🏷️ Top 10 브랜드별 상품 수 <span class="badge-api">실시간</span></h4>';
  var tbMax = (d.top_brands && d.top_brands[0]) ? d.top_brands[0].count : 1;
  (d.top_brands||[]).forEach(function(b){
    html += '<div class="mc-bar"><span class="mc-bar-label">'+esc(b.name)+'</span><div class="mc-bar-fill" style="width:'+Math.round(b.count/tbMax*100)+'%;background:#d97706;"></div><span class="mc-bar-val">'+b.count+'</span></div>';
  });
  html += '</div>';

  html += '</div></div>';
  dash.innerHTML = html;
}

function mmCard(value, label, sub, colorClass) {
  return '<div class="mm-card"><div class="mm-value '+(colorClass||'')+'">'+value+'</div><div class="mm-label">'+label+'</div>'+(sub?'<div class="mm-sub">'+sub+'</div>':'')+'</div>';
}

function renderTrendLine(d) {
  var area = document.getElementById('trendLineArea');
  area.style.display = 'block';
  area.innerHTML = '<div class="trend-line-box"><h4>📈 "'+esc(d.keyword)+'" 90일 검색 트렌드 <span style="font-size:9px;color:#0d9488;background:#f0fdfa;padding:2px 6px;border-radius:3px;margin-left:6px;">DataLab API</span></h4><canvas id="trendLineChart" height="120"></canvas></div>';

  _trendCharts.forEach(function(c){c.destroy();}); _trendCharts=[];
  var ctx = document.getElementById('trendLineChart');
  if (ctx) {
    var labels = (d.labels||[]).map(function(l){return l.slice(5);});
    _trendCharts.push(new Chart(ctx.getContext('2d'), {
      type:'line',
      data:{labels:labels, datasets:[{label:'검색 트렌드',data:d.values||[],borderColor:'#0d9488',backgroundColor:'rgba(13,148,136,.1)',fill:true,tension:0.3,pointRadius:3,pointBackgroundColor:'#0d9488'}]},
      options:{responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:false,grid:{color:'#f0f0f0'}},x:{grid:{display:false}}}}
    }));
  }
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
